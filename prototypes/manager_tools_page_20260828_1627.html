<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Manager tools page — 2 Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#111111; --ink-muted:#6b7280; --ink-faint:#9aa0a6; --hairline:#ececec; --hairline-soft:#f1f1f3; --paper:#ffffff; --surface:#fafafa; --surface-hover:#f6f7f8; --accent:#2563eb; --accent-hover:#1d4fd8; --accent-soft:#eef4ff; --accent-red:#e5484d; --status-pending:#d99a2b;
          --color-text: var(--ink); --color-bg: #f3f3f5; --color-muted: var(--ink-muted); --color-grey-300: var(--hairline); --color-grey-050: #ebebee; --color-success: var(--accent); --color-error: var(--accent-red); --ui-radius-curve: 12px; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
  .toolbar { position: sticky; top: 0; z-index: 50; display: flex; gap: 12px; padding: 12px 24px; background: var(--paper); border-bottom: 1px solid var(--hairline); }
  .tool-btn { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--paper); color: var(--ink-muted); cursor: pointer; }
  .tool-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tool-btn.danger { border-color: var(--accent-red); color: var(--accent-red); }
  header.page-header { padding: 32px 24px 8px; max-width: 1400px; margin: 0 auto; }
  header.page-header h1 { font-weight: 700; font-size: 22px; letter-spacing: -0.01em; margin: 0 0 6px; }
  header.page-header p { color: var(--ink-muted); font-size: 14px; max-width: 72ch; line-height: 1.55; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 24px; padding: 24px; max-width: 1500px; margin: 0 auto; }
  .card { border: 1px solid var(--hairline); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .preview { aspect-ratio: 14/9; background: var(--color-grey-050); display: block; cursor: pointer; overflow: hidden; position: relative; }
  .preview-scale { position: absolute; top: 50%; left: 50%; width: 1400px; height: 900px; transform-origin: center; pointer-events: none; }
  .card-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card-num { font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--ink-faint); text-transform: uppercase; }
  .card-name { font-weight: 700; font-size: 15px; }
  .card-tagline { font-size: 13px; color: var(--ink-muted); line-height: 1.5; }
  .select-row { display: flex; align-items: center; gap: 8px; font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); cursor: pointer; user-select: none; }
  .select-row input { accent-color: var(--accent); width: 16px; height: 16px; }
  textarea.comment { width: 100%; min-height: 72px; padding: 10px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--paper); color: var(--ink); font-family: inherit; font-size: 14px; resize: vertical; box-sizing: border-box; }
  .card-foot { display: flex; justify-content: space-between; font-family: "Space Mono", monospace; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.12em; text-transform: uppercase; }
  .saved-badge { opacity: 0; transition: opacity 0.2s; color: var(--accent); }
  .saved-badge.show { opacity: 1; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(17,17,17,0.92); display: grid; place-items: center; z-index: 100; padding: 24px; overflow: auto; }
  .modal-close { position: fixed; top: 16px; right: 20px; background: var(--paper); border: 1px solid var(--accent-red); color: var(--accent-red); font-size: 32px; font-weight: 300; cursor: pointer; line-height: 1; z-index: 110; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-family: inherit; }
  .modal-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; display: grid; place-items: center; background: var(--paper); border: 1px solid var(--ink); color: var(--ink); border-radius: 50%; font-size: 28px; font-weight: 300; cursor: pointer; line-height: 1; z-index: 110; opacity: 0.85; font-family: inherit; }
  .modal-nav.prev { left: 20px; } .modal-nav.next { right: 20px; }
  .modal-counter { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #ccc; z-index: 110; pointer-events: none; }
  .modal-inner { transform-origin: top center; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 8px; font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .toast.show { opacity: 1; }
  
.v1-page{width:1400px;height:900px;min-height:900px;background:var(--paper);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);position:relative;overflow:hidden;box-sizing:border-box;-webkit-font-smoothing:antialiased}

.v1-list{max-width:760px;margin:32px auto 0}

.v1-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}

.v1-edit-acts{display:flex;align-items:center;gap:8px;padding-top:2px}
.v1-add{margin-top:24px}

    <div class="card-tagline">${v.tagline}</div><textarea class="comment" data-id="${v.id}" placeholder="Feedback on ${v.name}…">${(saved.comment || '').replace(/</g,'&lt;')}</textarea><div class="card-foot"><span class="saved-badge" data-badge="${v.id}">Saved ✓</span></div></div>`;
  grid.appendChild(card); });
updateCount();
const timers = {};
grid.addEventListener('input', e => { const ta = e.target.closest('textarea[data-id]'); if (!ta) return; const id = ta.dataset.id; clearTimeout(timers[id]); timers[id] = setTimeout(() => { const s = loadState(); s[id] = { ...(s[id] || {}), comment: ta.value }; saveState(s); const badge = document.querySelector(`[data-badge="${id}"]`); badge.classList.add('show'); setTimeout(() => badge.classList.remove('show'), 1200); }, 400); });
grid.addEventListener('change', e => { const cb = e.target.closest('input[data-select]'); if (!cb) return; const id = cb.dataset.select; const s = loadState(); s[id] = { ...(s[id] || {}), selected: cb.checked }; saveState(s); cb.closest('.card').classList.toggle('selected', cb.checked); });
const modalRoot = document.getElementById('modalRoot'); let currentModalId = null;
function openVariant(id) { const idx = VARIANTS.findIndex(x => String(x.id) === String(id)); if (idx === -1) return; const v = VARIANTS[idx]; const prev = VARIANTS[(idx - 1 + VARIANTS.length) % VARIANTS.length]; const next = VARIANTS[(idx + 1) % VARIANTS.length]; currentModalId = v.id;
  const scale = Math.min(1, (window.innerWidth - 160) / 1400);
  modalRoot.innerHTML = `<div class="modal-overlay"><button class="modal-close" aria-label="Close">&times;</button><button class="modal-nav prev" data-nav="${prev.id}" aria-label="Previous variant">&#8249;</button><button class="modal-nav next" data-nav="${next.id}" aria-label="Next variant">&#8250;</button><div class="modal-counter">V${String(v.id).padStart(2,'0')} · ${idx+1} of ${VARIANTS.length} — ${v.name}</div><div class="modal-inner" style="transform: scale(${scale}); width: 1400px;" onclick="event.stopPropagation()">${v.html}</div></div>`; }
function closeModal() { modalRoot.innerHTML = ''; currentModalId = null; }
function navModal(dir) { if (currentModalId == null) return; const idx = VARIANTS.findIndex(x => String(x.id) === String(currentModalId)); if (idx === -1) return; openVariant(VARIANTS[(idx + dir + VARIANTS.length) % VARIANTS.length].id); }
grid.addEventListener('click', e => { const open = e.target.closest('[data-open]'); if (!open) return; openVariant(open.dataset.open); });
modalRoot.addEventListener('click', e => { const nav = e.target.closest('[data-nav]'); if (nav) { e.stopPropagation(); openVariant(nav.dataset.nav); return; } if (e.target.closest('.modal-close')) { closeModal(); return; } if (e.target.classList && e.target.classList.contains('modal-overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (currentModalId == null) return; if (e.key === 'Escape') closeModal(); else if (e.key === 'ArrowLeft') navModal(-1); else if (e.key === 'ArrowRight') navModal(1); });
document.getElementById('exportBtn').addEventListener('click', async () => { const s = loadState(); const payload = { exportedAt: new Date().toISOString(), target: 'Manager tools page', variants: VARIANTS.map(v => ({ id: v.id, name: v.name, tagline: v.tagline, selected: !!(s[v.id] && s[v.id].selected), comment: (s[v.id] && s[v.id].comment) || null })) }; const json = JSON.stringify(payload, null, 2); try { await navigator.clipboard.writeText(json); showToast('Copied — paste to Claude'); } catch { prompt('Copy manually:', json); } });
document.getElementById('clearBtn').addEventListener('click', () => { if (!confirm('Clear all comments and selections?')) return; localStorage.removeItem(STORE_KEY); location.reload(); });
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
</script>
