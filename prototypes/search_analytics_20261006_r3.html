<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search and Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  /* Black and white. Colour means ONE thing: which number a line is (validated categorical order). */
  @property --cur { syntax: '<color>'; inherits: true; initial-value: #2a78d6; }
  :root {
    --paper: #ffffff; --ink: #111111; --ink-2: #6b7280; --ink-3: #9aa0a6; --line: #ececec; --mist: #f4f4f5;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 6px; }
  svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

  .mockbar { position: sticky; top: 0; z-index: 50; display: flex; gap: 28px; align-items: center; padding: 12px 40px; background: #fafafa; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
  .mockbar .grp { display: flex; gap: 6px; align-items: center; }
  .mockbar .grp > span { margin-right: 4px; }
  .mockbar button { padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-size: 12px; }
  .mockbar button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .is-analytics .search-only { display: none !important; }

  .page { max-width: 1240px; padding: 32px 40px 90px; }
  .top { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
  .engines { display: flex; gap: 14px; align-items: center; }
  .eng { position: relative; color: var(--ink-3); transition: color .2s; padding: 4px; }
  .eng svg { width: 18px; height: 18px; }
  .eng.on, .eng:hover { color: var(--ink); }
  .eng .pend { position: absolute; top: 1px; right: -2px; width: 6px; height: 6px; border-radius: 50%; background: #d99a2b; }
  .periods { position: relative; display: flex; gap: 18px; }
  .qbtn { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-3); padding: 6px 0; transition: color .25s; }
  .qbtn:hover { color: var(--ink); }
  .qbtn.on { color: var(--ink); font-weight: 700; }
  .uline { position: absolute; bottom: -2px; height: 2px; border-radius: 2px; background: var(--ink); transition: left .45s var(--ease), width .45s var(--ease); }

  /* ── one chart block ── */
  .block { margin-top: 30px; }
  .block + .block { margin-top: 56px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; min-height: 28px; }
  .tg { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink-3); transition: color .25s; padding: 3px 0; }
  .tg:hover { color: var(--ink); }
  .tg .dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--mc); transition: background .25s; }
  .tg.on { color: var(--ink); }
  .tg.on .dot { background: var(--mc); }
  .tg svg { width: 18px; height: 18px; }
  .unit { font-size: 14px; color: var(--ink-2); margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unit:empty { display: none; }
  .board { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 36px; margin-top: 8px; align-items: start; }
  .chartwrap { position: relative; }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .ax { font-family: 'Space Mono', monospace; font-size: 10.5px; fill: var(--ink-3); }
  .scrub { pointer-events: none; opacity: 0; transition: opacity .15s; }
  .scrubbing .scrub { opacity: 1; }
  /* small: one line, the day and each value */
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 5px 8px; font-family: 'Space Mono', monospace; font-size: 11px; white-space: nowrap; transform: translate(-50%, -100%) translateY(-12px); opacity: 0; transition: opacity .15s; z-index: 4; display: flex; gap: 9px; align-items: center; }
  .tip .dt { color: #b8bcc4; }
  .tip b { font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
  .tip b i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .scrubbing .tip { opacity: 1; }
  .empty { position: absolute; inset: 42% 0 auto; text-align: center; font-size: 14px; color: var(--ink-3); opacity: 0; transition: opacity .3s; pointer-events: none; }
  .none-on .empty { opacity: 1; }

  .pin { cursor: pointer; }
  .pin .bub { transition: transform .3s var(--ease); transform-box: fill-box; transform-origin: center; }
  .pin:hover .bub, .pin:focus .bub { transform: scale(1.12); }
  .card { position: absolute; z-index: 5; width: 260px; padding: 12px 14px; border-radius: 12px; background: #fff; box-shadow: 0 10px 30px rgba(17,17,17,.12), 0 0 0 1px rgba(17,17,17,.05); opacity: 0; transform: translate(-50%, calc(-100% - 22px)) scale(.96); transform-origin: bottom center; transition: opacity .22s, transform .32s var(--ease); pointer-events: none; }
  .card.show { opacity: 1; transform: translate(-50%, calc(-100% - 26px)) scale(1); }
  .card .h { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; }
  .card .ci { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; flex: none; }
  .card .ci.auto { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .card .ci svg { width: 13px; height: 13px; }
  .card .when { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-3); margin: 6px 0 0 36px; }
  .card .move { display: flex; align-items: center; gap: 8px; margin: 6px 0 0 36px; font-family: 'Space Mono', monospace; font-size: 12.5px; }
  .card .move i { width: 7px; height: 7px; border-radius: 50%; }
  .card .move .a { color: var(--ink-3); }
  .card .move .b { font-weight: 700; }

  /* the stats beside a chart: right-aligned, as on today's Analytics page */
  .stats { text-align: right; padding-top: 4px; }
  .ftabs { position: relative; display: flex; justify-content: flex-end; gap: 14px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .ftabs .qbtn { font-family: 'Instrument Sans'; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
  .ftabs .qbtn i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .ftabs .uline { bottom: -1px; }
  .st { padding: 18px 0 0; }
  .st .k { font-size: 12.5px; color: var(--ink-3); }
  .st .v { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: -.03em; line-height: 1.05; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .st.big .v { font-size: 46px; letter-spacing: -.05em; }
  .st .s { font-family: 'Space Mono', monospace; font-size: 11.5px; color: var(--ink-2); margin-top: 4px; }
  .st .s b { color: var(--ink); }

  /* ── below the charts ── */
  .sec { margin-top: 72px; }
  .sec-h { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }
  .sec-h svg { width: 18px; height: 18px; }
  .two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 64px; }
  .mapgrid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 44px; align-items: center; }
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px 12px; }
  .ring { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ring .rv { position: relative; width: 86px; height: 86px; }
  .ring svg.r { width: 86px; height: 86px; transform: rotate(-90deg); }
  .ring .rg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); }
  .ring .rg svg { width: 28px; height: 28px; }
  .ring.zero .rg { color: var(--ink-3); }
  .ring .rn { font-size: 13px; color: var(--ink-2); }
  .ring .rp { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; margin-top: -4px; }
  .ring.zero .rp { color: var(--ink-3); font-weight: 400; }
  .waffle { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 290px; }
  .waffle i { aspect-ratio: 1; border-radius: 4px; background: var(--mist); display: block; transition: background .45s; }
  .wleg { display: flex; gap: 22px; margin-top: 22px; }
  .wleg div { display: flex; align-items: center; gap: 10px; }
  .wleg svg { width: 24px; height: 24px; }
  .wleg .wp { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 18px; }
  .wleg .wn { font-size: 12px; color: var(--ink-2); }
  .wleg .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .mapwrap { position: relative; }
  .mapwrap canvas, .mapwrap svg { display: block; width: 100%; height: auto; }
  .mapwrap svg { position: absolute; inset: 0; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 1fr 50px; gap: 14px; align-items: center; height: 52px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row:last-child { border-bottom: 0; }
  .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm small { display: block; font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
  .row .meter { height: 4px; border-radius: 99px; background: var(--mist); overflow: hidden; }
  .row .meter i { display: block; height: 100%; border-radius: 99px; background: var(--ink); transform-origin: left; transform: scaleX(0); transition: transform 1s var(--ease); }
  .row .v { font-family: 'Space Mono', monospace; font-size: 13px; text-align: right; }
  .mapgrid .row { grid-template-columns: minmax(0, 1fr) 70px 46px; }
  .row.cover { grid-template-columns: 44px minmax(0, 1fr) 1fr 44px; height: 60px; }
  .row.cover img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: block; }
  .more { margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-3); }
  .srch { display: grid; grid-template-columns: minmax(0, 1fr) 84px 54px 60px; gap: 14px; align-items: center; height: 48px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .srch:last-child { border-bottom: 0; }
  .srch .spark { width: 84px; height: 22px; }
  .srch .rk { font-family: 'Space Mono', monospace; font-size: 13px; text-align: right; }
  .srch .mv { font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 700; text-align: right; }
  .srch .mv.flat { color: var(--ink-3); font-weight: 400; }
  .srch .mv.newb { justify-self: end; font-weight: 600; font-family: 'Instrument Sans'; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--mist); }

  @media (max-width: 960px) {
    .board, .two, .mapgrid { grid-template-columns: 1fr; gap: 28px; }
    .stats { text-align: left; } .ftabs { justify-content: flex-start; }
    .page { padding: 24px 16px 60px; }
    .unit { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</head>

  // Skeen's real numbers: Sep 7 to Oct 6, and the last 7 days (Sep 30 to Oct 6)
  const SRC = wk ? [['Instagram', 'instagram', 36], ['YouTube', 'youtube', 30], ['Direct', 'cursorfill', 20], ['Web search', 'google', 10], ['TikTok', 'tiktok', 3], ['Facebook', 'facebook', 0], ['SoundCloud', 'soundcloud', 0], ['Snapchat', 'snapchat', 0]]
    : [['Instagram', 'instagram', 47], ['Direct', 'cursorfill', 23], ['YouTube', 'youtube', 21], ['Web search', 'google', 6], ['TikTok', 'tiktok', 2], ['Facebook', 'facebook', .2], ['SoundCloud', 'soundcloud', .2], ['Snapchat', 'snapchat', .1]]
  const DEV = wk ? [['desktop', 'Computer', 54, '#111111'], ['mobile', 'Phone', 44, '#9aa0a6'], ['tablet', 'Tablet', 2, '#d9dade']] : [['mobile', 'Phone', 53, '#111111'], ['desktop', 'Computer', 45, '#9aa0a6'], ['tablet', 'Tablet', 2, '#d9dade']]
  const CT = wk ? [['United States', 168, 93], ['Germany', 16, 11], ['United Kingdom', 16, 10], ['Australia', 12, 4], ['Canada', 11, 6], ['Hungary', 10, 3]] : [['United States', 989, 351], ['Germany', 126, 48], ['United Kingdom', 100, 45], ['Netherlands', 87, 33], ['Canada', 83, 26], ['Australia', 56, 9]]
  const COV = { rb: 'https://oinywwblswidyupkpywa.supabase.co/storage/v1/object/public/media/c6c2ea6e-4135-4ebb-afbe-8c9e21785f57/covers/51bc45ed-1df0-4a83-82a0-d366cee8ae92.jpg', np: 'https://i1.sndcdn.com/artworks-meoNkzNdXypr1Iw8-fSaqyQ-t500x500.jpg', ww: 'https://i.scdn.co/image/ab67616d0000b273d338d47f8f8964cc04f794e2', st: 'https://i1.sndcdn.com/artworks-zgNy2DVV1R935OOc-jI4ceg-t500x500.jpg', yw: 'https://i.scdn.co/image/ab67616d0000b27302e3919b9f17620c0e5a12ab' }
  const SONGS = wk ? [['Rushing Back [Skeen Remix]', 4, COV.rb], ['Small Talk (Briston Maroney) [Skeen Remix]', 2, COV.st], ['Skeen LIVE @ Navy Pier Open Air', 1, COV.np], ['What I Want', 1, COV.ww]]
    : [['Rushing Back [Skeen Remix]', 86, COV.rb], ['Skeen LIVE @ Navy Pier Open Air', 23, COV.np], ['What I Want', 16, COV.ww], ['Small Talk (Briston Maroney) [Skeen Remix]', 13, COV.st], ['You Were There', 4, COV.yw]]
  const R0 = 36, CIRC = 2 * Math.PI * R0
  box.innerHTML = `
    <div class="sec two">
      <div><div class="sec-h">${icon('links')}Where they came from</div><div class="rings">${SRC.map(([nm, g, p]) => `<div class="ring ${p < 1 ? 'zero' : ''}"><div class="rv"><svg class="r" viewBox="0 0 86 86"><circle cx="43" cy="43" r="${R0}" fill="none" stroke="#f1f1f3" stroke-width="5"/><circle class="arc" cx="43" cy="43" r="${R0}" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}" data-p="${p}"/></svg><span class="rg">${icon(g)}</span></div><span class="rn">${nm}</span><span class="rp">${p < 1 ? (p ? '<1%' : '0%') : Math.round(p) + '%'}</span></div>`).join('')}</div></div>
      <div><div class="sec-h">${icon('mobile')}Phone or computer</div><div class="waffle" id="waffle">${Array.from({ length: 100 }, () => '<i></i>').join('')}</div>
        <div class="wleg">${DEV.map(([g, nm, p, c]) => `<div><span class="sw" style="background:${c}"></span>${icon(g)}<span><div class="wp">${p}%</div><div class="wn">${nm}</div></span></div>`).join('')}</div></div>
    </div>
    <div class="sec"><div class="sec-h">${icon('globe')}Where they are</div>
      <div class="mapgrid"><div class="mapwrap" id="mapwrap"></div>
        <div>${CT.map(([nm, v, c]) => `<div class="row"><span class="nm">${nm}<small>${c} cities</small></span><span class="meter"><i data-w="${v / CT[0][1]}"></i></span><span class="v">${num(v)}</span></div>`).join('')}<div class="more">+ ${wk ? 28 : 66} more countries</div></div></div></div>
    <div class="sec"><div class="sec-h">${icon('music')}Most played</div><div class="two" style="gap:0 64px">${[SONGS.slice(0, 3), SONGS.slice(3)].map((col) => `<div>${col.map(([nm, v, img]) => `<div class="row cover"><img src="${img}" alt=""><span class="nm">${nm}</span><span class="meter"><i data-w="${v / SONGS[0][1]}"></i></span><span class="v">${v}</span></div>`).join('')}</div>`).join('')}</div></div>`
  grow()
  box.querySelectorAll('.arc').forEach((a, i) => { const p = +a.dataset.p; setTimeout(() => { a.style.transition = reduce ? 'none' : 'stroke-dashoffset 1.1s cubic-bezier(.22,.8,.24,1)'; a.style.strokeDashoffset = CIRC * (1 - Math.max(p, p ? 1.2 : 0) / 100) }, reduce ? 0 : 250 + i * 90) })
  const cells = [...$('waffle').children], order = cells.map((_, i) => i).sort((a, b) => ((a % 10) + Math.floor(a / 10)) - ((b % 10) + Math.floor(b / 10)) || a - b)
  let kk = 0; const colours = DEV.flatMap(([, , p, c]) => Array(p).fill(c)); while (colours.length < 100) colours.push('#d9dade')
  order.forEach((ci, i) => setTimeout(() => (cells[ci].style.background = colours[kk++]), reduce ? 0 : 200 + i * 9))
  drawMap(wk ? CITIES7 : CITIES30)
}
function grow() { requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.row .meter i').forEach((i, n) => { i.style.transitionDelay = (reduce ? 0 : 50 * n) + 'ms'; i.style.transform = `scaleX(${i.dataset.w})` }))) }

/* The world as quiet dots; every city a visit came from as an ink dot, sized by visits, landing
   biggest first. */
let LAND = null
async function drawMap(cities) {
  const box = $('mapwrap'); if (!box || typeof d3 === 'undefined') return
  const Wm = 900, Hm = 460
  box.innerHTML = `<canvas width="${Wm * 2}" height="${Hm * 2}" style="aspect-ratio:${Wm}/${Hm}"></canvas><svg viewBox="0 0 ${Wm} ${Hm}"></svg>`
  if (!LAND) { const t = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')).json(); LAND = topojson.feature(t, t.objects.land) }
  const proj = d3.geoNaturalEarth1().rotate([-10, 0]).fitExtent([[0, 0], [Wm, Hm + 60]], { type: 'Sphere' })
  const off = document.createElement('canvas'); off.width = Wm; off.height = Hm
  const oc = off.getContext('2d'); oc.fillStyle = '#000'; oc.beginPath(); d3.geoPath(proj, oc)(LAND); oc.fill()
  const px = oc.getImageData(0, 0, Wm, Hm).data
  const cv = box.querySelector('canvas').getContext('2d'); cv.scale(2, 2); cv.fillStyle = '#e4e4e7'
  for (let y = 4; y < Hm; y += 7) for (let x = 4; x < Wm; x += 7) { if (!(px[(y * Wm + x) * 4 + 3] > 0)) continue; const ll = proj.invert([x, y]); if (ll && ll[1] < -57) continue; cv.beginPath(); cv.arc(x, y, 1.6, 0, 7); cv.fill() }
  const s = box.querySelector('svg'), mx = Math.max(...cities.map((c) => c[2]))
  ;[...cities].sort((a, b) => b[2] - a[2]).forEach(([lat, lon, v], i) => {
    const p = proj([lon, lat]); if (!p || p[1] > Hm) return
    const c = document.createElementNS(NS, 'circle'), r = 2 + Math.sqrt(v / mx) * 12
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', r); c.setAttribute('fill', '#111'); c.setAttribute('fill-opacity', v > 2 ? .75 : .45)
    if (!reduce) c.animate([{ r: 0, opacity: 0 }, { r, opacity: 1 }], { duration: 600, delay: 200 + Math.min(i, 140) * 9, easing: 'cubic-bezier(.3,1.4,.5,1)', fill: 'backwards' })
    s.appendChild(c)
  })
}

/* ═══════════ wiring ═══════════ */
function boot() { document.body.classList.toggle('is-analytics', S.page === 'analytics'); periods(); blocks(); lower() }
const pick = (attr, val) => document.querySelectorAll(`[data-${attr}]`).forEach((x) => x.classList.toggle('on', x.dataset[attr] === val))
document.querySelectorAll('[data-page]').forEach((b) => b.addEventListener('click', () => { S.page = b.dataset.page; pick('page', S.page); S.period = S.page === 'analytics' ? '30d' : S.data === 'real' ? '28d' : '3m'; boot() }))
document.querySelectorAll('[data-data]').forEach((b) => b.addEventListener('click', () => { S.data = b.dataset.data; pick('data', S.data); S.period = S.data === 'real' ? '28d' : '3m'; boot() }))
const qs = new URLSearchParams(location.search)
if (qs.get('page') === 'analytics') { S.page = 'analytics'; pick('page', 'analytics'); S.period = '30d' }
if (qs.get('data') === 'real') { S.data = 'real'; pick('data', 'real'); if (S.page === 'search') S.period = '28d' }
document.fonts.ready.then(boot)
</script>
