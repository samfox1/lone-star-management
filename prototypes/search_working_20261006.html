<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search · is it working</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* The page is black and white. Colour means ONE thing here: which of the four numbers.
     Four variables, in the categorical order the dataviz validator passed (light mode). */
  @property --cur { syntax: '<color>'; inherits: true; initial-value: #2a78d6; }
  :root {
    --paper: #ffffff; --ink: #111111; --ink-2: #6b7280; --ink-3: #9aa0a6; --line: #ececec; --mist: #f4f4f5;
    --c1: #2a78d6;  /* your spot */
    --c2: #eb6834;  /* seen */
    --c3: #1baf7a;  /* on page 1 */
    --c4: #eda100;  /* from AI */
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
  svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

  .mockbar { position: sticky; top: 0; z-index: 50; display: flex; gap: 28px; align-items: center; padding: 12px 40px; background: #fafafa; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
  .mockbar .grp { display: flex; gap: 6px; align-items: center; }
  .mockbar .grp > span { margin-right: 4px; }
  .mockbar button { padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-size: 12px; }
  .mockbar button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .page { max-width: 1180px; padding: 40px 40px 80px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .engines { display: flex; gap: 4px; }
  .eng { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); }
  .eng svg { width: 16px; height: 16px; }
  .eng.on { color: var(--ink); background: var(--mist); }
  .eng .pend { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: #d99a2b; }
  .periods { display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: var(--mist); position: relative; }
  .periods button { position: relative; z-index: 1; padding: 6px 13px; font-size: 12px; color: var(--ink-2); border-radius: 99px; transition: color .25s; font-family: 'Space Mono', monospace; }
  .periods button.on { color: var(--ink); }
  .periods .knob { position: absolute; top: 3px; bottom: 3px; border-radius: 99px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); transition: left .45s var(--ease), width .45s var(--ease); }

  .verdict { display: flex; align-items: center; gap: 14px; margin-top: 34px; }
  .badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; flex: none; }
  .badge.wait { background: var(--mist); color: var(--ink-2); }
  .badge svg { width: 22px; height: 22px; stroke-width: 2.2; }
  .badge path.draw { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .badge.go path.draw { animation: draw .6s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .vt { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .vs { font-size: 14px; color: var(--ink-3); margin-top: 2px; }

  /* The four numbers ARE the chart's switch (and its legend). */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 28px; }
  .tile { display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px 12px 12px; border-radius: 16px; text-align: left; transition: background .25s; position: relative; }
  .tile:hover { background: #fafafa; }
  .tile.sel { background: var(--mist); }
  .tile .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--mist); display: grid; place-items: center; color: var(--ink); flex: none; transition: background .35s, color .35s, box-shadow .35s; }
  .tile.sel .ico { background: var(--mc); color: #fff; }
  .all-on .tile .ico { background: #fff; box-shadow: inset 0 0 0 2px var(--mc); color: var(--ink); }
  .tile .val { display: flex; align-items: baseline; gap: 10px; }
  .tile .n { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 30px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile .d { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: var(--ink); opacity: 0; transform: translateY(4px); transition: opacity .4s, transform .4s var(--ease); white-space: nowrap; }
  .tile .d.show { opacity: 1; transform: none; }
  .tile .d.flat { color: var(--ink-3); font-weight: 400; }
  .tile .lab { font-size: 13px; color: var(--ink-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .tile .lab i { width: 7px; height: 7px; border-radius: 50%; background: var(--mc); display: none; }
  .all-on .tile .lab i { display: inline-block; animation: popin .35s var(--ease); }
  @keyframes popin { from { transform: scale(0); } }

  .stage { position: relative; margin-top: 22px; }
  .bar { display: flex; justify-content: space-between; align-items: center; height: 32px; }
  .unit { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; transition: opacity .2s; }
  .together { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; color: var(--ink-2); transition: box-shadow .25s, color .25s; }
  .together:hover { color: var(--ink); }
  .together.on { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
  .together.off { opacity: .4; cursor: default; }
  .together .dots { display: inline-grid; grid-template-columns: repeat(2, 6px); gap: 2px; }
  .together .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .chartwrap { position: relative; margin-top: 6px; }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .ax { font-family: 'Space Mono', monospace; font-size: 11px; fill: var(--ink-3); }
  .scrub { pointer-events: none; opacity: 0; transition: opacity .15s; }
  .scrubbing .scrub { opacity: 1; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 12px; padding: 8px 11px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -100%) translateY(-16px); opacity: 0; transition: opacity .15s; }
  .tip b { font-family: 'Space Mono', monospace; font-size: 13px; }
  .tip .dt { color: #b8bcc4; margin-left: 8px; font-family: 'Space Mono', monospace; font-size: 11px; }
  .tip .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .tip .row:first-child { margin-top: 0; }
  .tip .row i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tip .row span { color: #b8bcc4; }
  .scrubbing .tip.scrubtip { opacity: 1; }

  .pin { cursor: pointer; }
  .pin .bub { transition: transform .3s var(--ease); transform-box: fill-box; transform-origin: center; }
  .pin:hover .bub, .pin:focus .bub { transform: scale(1.12); }
  .card { position: absolute; z-index: 5; width: 270px; padding: 14px 16px; border-radius: 14px; background: #fff; box-shadow: 0 10px 30px rgba(17,17,17,.12), 0 0 0 1px rgba(17,17,17,.05); opacity: 0; transform: translate(-50%, calc(-100% - 22px)) scale(.96); transform-origin: bottom center; transition: opacity .22s, transform .32s var(--ease); pointer-events: none; }
  .card.show { opacity: 1; transform: translate(-50%, calc(-100% - 26px)) scale(1); }
  .card .h { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
  .card .ci { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; flex: none; }
  .card .ci.auto { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .card .ci svg { width: 14px; height: 14px; }
  .card .when { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-3); margin: 8px 0 0 38px; }
  .card .move { display: flex; align-items: center; gap: 8px; margin: 8px 0 0 38px; font-family: 'Space Mono', monospace; font-size: 13px; }
  .card .move i { width: 8px; height: 8px; border-radius: 50%; }
  .card .move .a { color: var(--ink-3); }
  .card .move .b { font-weight: 700; }
  .addpin { position: absolute; right: 0; top: -40px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); border: 1.5px dashed #d9dade; transition: color .2s, border-color .2s, transform .3s var(--ease); }
  .addpin:hover { color: var(--ink); border-color: var(--ink); transform: rotate(90deg); }

  /* Replay */
  .replay { display: none; grid-template-columns: minmax(0, 1fr) 280px; gap: 56px; align-items: start; margin-top: 34px; --accent: var(--c1); }
  .show-replay .replay { display: grid; }
  .show-replay .climb { display: none; }
  .show-replay .tile { pointer-events: none; }
  .serp { position: relative; border-radius: 20px; background: var(--mist); padding: 22px; }
  .q { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 18px; border-radius: 99px; background: #fff; font-size: 17px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .q svg { width: 17px; height: 17px; }
  .q .caret { width: 1.5px; height: 20px; background: var(--ink); animation: blink 1s steps(1) infinite; margin-left: -6px; }
  @keyframes blink { 50% { opacity: 0; } }
  .lanes { position: relative; margin-top: 16px; }
  .lane { height: 62px; display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 12px; }
  .lane .k { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-3); text-align: right; }
  .lane .sk { height: 42px; border-radius: 12px; background: #fff; opacity: .55; display: flex; flex-direction: column; justify-content: center; gap: 7px; padding: 0 16px; }
  .lane .sk i { display: block; height: 7px; border-radius: 99px; background: #e9e9ec; }
  .me { position: absolute; top: 0; left: 38px; right: 0; height: 54px; border-radius: 14px; background: #fff; display: flex; align-items: center; gap: 12px; padding: 0 14px; box-shadow: 0 8px 24px rgba(17,17,17,.10), 0 0 0 1.5px var(--accent); will-change: transform; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
  .me .t { font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
  .me .u { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 12px); display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 10px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 13px; opacity: 0; transition: opacity .25s, transform .4s var(--ease); white-space: nowrap; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .ci { width: 24px; height: 24px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; }
  .toast .ci svg { width: 13px; height: 13px; }
  .readout .big { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 72px; letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; }
  .readout .big small { font-size: 32px; color: var(--ink-3); letter-spacing: -.02em; margin-right: 2px; }
  .readout .sub { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; margin-top: 10px; }
  .readout .when { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-3); margin-top: 26px; }
  .readout .seen { margin-top: 22px; display: flex; align-items: center; gap: 10px; }
  .readout .seen .n { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 22px; }
  .player { grid-column: 1 / -1; display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: center; margin-top: 4px; }
  .play { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; transition: transform .2s var(--ease); }
  .play:hover { transform: scale(1.06); }
  .play svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
  .track { position: relative; height: 56px; cursor: pointer; touch-action: none; }
  .track .rail { position: absolute; left: 0; right: 0; top: 21px; height: 3px; border-radius: 99px; background: var(--line); }
  .track .fill { position: absolute; left: 0; top: 21px; height: 3px; border-radius: 99px; background: var(--accent); }
  .track .head { position: absolute; top: 14px; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgba(0,0,0,.12); }
  .track .tp { position: absolute; top: 9px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; transition: transform .35s var(--ease); }
  .track .tp.auto { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .track .tp svg { width: 12px; height: 12px; }
  .track .tp.flash { transform: scale(1.3); }
  .track .tl { position: absolute; top: 40px; white-space: nowrap; font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--ink-3); transform: translateX(-50%); }

  .lower { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 64px; margin-top: 52px; }
  .sec-h { display: flex; align-items: center; gap: 9px; color: var(--ink-2); font-size: 13px; margin-bottom: 8px; }
  .srch { display: grid; grid-template-columns: minmax(0, 1fr) 84px 54px 60px; gap: 14px; align-items: center; height: 48px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .srch:last-child { border-bottom: 0; }
  .srch .spark { width: 84px; height: 22px; }
  .srch .rk { font-family: 'Space Mono', monospace; font-size: 13px; text-align: right; }
  .srch .mv { font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 700; text-align: right; }
  .srch .mv.flat { color: var(--ink-3); font-weight: 400; }
  .srch .mv.newb { justify-self: end; font-weight: 600; font-family: 'Instrument Sans'; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--mist); }
  .ai-row { display: flex; align-items: center; justify-content: space-between; height: 48px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .ai-row:last-child { border-bottom: 0; }
  .ai-row .c { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px; }
  .ai-row.zero { color: var(--ink-3); }
  .ai-row .meter { flex: 1; margin: 0 16px; height: 4px; border-radius: 99px; background: var(--mist); overflow: hidden; }
  .ai-row .meter i { display: block; height: 100%; background: var(--c4); border-radius: 99px; transform-origin: left; transform: scaleX(0); transition: transform .9s var(--ease); }
  .clicks { text-decoration: none; display: inline-flex; align-items: center; gap: 10px; margin-top: 44px; padding: 10px 16px 10px 12px; border-radius: 99px; background: var(--mist); font-size: 13px; color: var(--ink-2); }
  .clicks b { color: var(--ink); font-family: 'Space Mono', monospace; }

  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .lower, .replay { grid-template-columns: 1fr; gap: 36px; }
    .page { padding: 28px 16px 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-google" viewBox="0 0 24 24"><path d="M18.13 6.86 A8 8 0 1 0 20 12" fill="none" stroke="currentColor" stroke-width="3.6"/><rect x="12" y="12" width="9.8" height="3.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-bing" viewBox="0 0 24 24"><path d="M6.3 2.6 L10.5 4.15 v11.4 l4.05 -1.7 -2.1 -1 -1.95 -4.4 6.6 2.95 c1.75 0.8 2.55 1.6 2.55 3 0 1.6 -0.95 2.7 -3.15 3.8 L10.5 21.4 6.3 19 z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-ai" viewBox="0 0 24 24"><path d="M12 2.1 C13.05 8 16 10.95 21.9 12 16 13.05 13.05 16 12 21.9 10.95 16 8 13.05 2.1 12 8 10.95 10.95 8 12 2.1 Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/></symbol>
  <symbol id="i-podium" viewBox="0 0 24 24"><path d="M3.5 20.5v-6h5.5v6M9 20.5V8.5h6v12M15 20.5v-4h5.5v4M3 20.5h18"/><path d="M12 3.2l.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2L9.1 5.3l2-.3z" stroke-width="1.2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="M4.5 6.5h15a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H11l-4.5 3.5v-3.5h-2a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/><path d="M8 13h8M8 16.5h5"/></symbol>
  <symbol id="i-links" viewBox="0 0 24 24"><path d="M9 15l6-6"/><path d="M10.5 7.5l1-1a3.5 3.5 0 0 1 5 5l-1 1"/><path d="M13.5 16.5l-1 1a3.5 3.5 0 0 1-5-5l1-1"/></symbol>

</svg>

<div class="mockbar">
  <div class="grp"><span>Chart</span><button data-chart="climb" class="on">Climb</button><button data-chart="replay">Replay</button></div>
  <div class="grp"><span>Numbers</span><button data-data="ex" class="on">Example, by January</button><button data-data="real">Skeen today (real)</button></div>
</div>

<main class="page" id="page">
  <div class="top">
    <div class="engines">
      <button class="eng on" aria-label="Google" title="Google"><svg class="ic"><use href="#i-google"/></svg></button>
      <button class="eng" aria-label="Bing, no numbers yet" title="Bing · no numbers yet"><svg class="ic"><use href="#i-bing"/></svg><i class="pend"></i></button>
    </div>
    <div class="periods" id="periods"><span class="knob" id="knob"></span><button data-p="28d">28d</button><button data-p="3m" class="on">3m</button><button data-p="all">All</button></div>
  </div>

  <div class="verdict">
    <span class="badge" id="badge"><svg class="ic" id="badge-ic"><use href="#i-check"/></svg></span>
    <div><div class="vt" id="vt"></div><div class="vs" id="vs"></div></div>
  </div>

  <div class="tiles" id="tiles" role="tablist" aria-label="What the chart shows"></div>

  <div class="stage">
    <div class="climb">
      <div class="bar">
        <div class="unit" id="unit"></div>
        <button class="together" id="together" aria-pressed="false" title="All four at once, as progress"><span class="dots"><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i><i style="background:var(--c4)"></i></span>All 4</button>
      </div>
      <div class="chartwrap" id="chartwrap">
        <svg class="chart" id="chart" viewBox="0 0 1100 380" role="img" aria-label="Chart"></svg>
        <div class="tip scrubtip" id="scrubtip"></div>
        <div class="card" id="card"></div>
      </div>
    </div>

    <div class="replay" id="replay">
      <div class="serp">
        <div class="q"><svg class="ic"><use href="#i-google"/></svg><span id="qtext"></span><i class="caret"></i></div>
        <div class="lanes" id="lanes"></div>
        <div class="toast" id="toast"></div>
      </div>
      <div class="readout">

  if (reduce) { $('revealr').setAttribute('width', W); pinEls.forEach(popPin); dots(false); ends(false); return }
  lines.forEach((l, i) => { l.style.strokeDasharray = lens[i]; l.style.strokeDashoffset = lens[i] })
  const start = performance.now() + 300, dur = 1700, popped = new Set()
  const lead = lines[0], ghost = document.createElementNS(NS, 'g')
  if (!allView()) { ghost.innerHTML = '<circle r="17" fill="#111"/><circle r="17" fill="none" stroke="#fff" stroke-width="2.5"/><text text-anchor="middle" y="5" font-family="Instrument Sans" font-weight="600" font-size="14" fill="#fff">S</text>'; $('ends').appendChild(ghost) }
  const step = (now) => {
    const t = Math.min(1, Math.max(0, (now - start) / dur)), e = ease(t)
    lines.forEach((l, i) => (l.style.strokeDashoffset = lens[i] * (1 - ease(Math.min(1, Math.max(0, (now - start - i * 90) / dur))))))
    const pt = lead.getPointAtLength(lens[0] * e)
    ghost.setAttribute('transform', `translate(${pt.x},${pt.y})`)
    $('revealr').setAttribute('width', pt.x)
    pinEls.forEach((p, i) => { if (!popped.has(i) && pt.x >= p.x - 4) { popped.add(i); popPin(p) } })
    if (t < 1 || now - start < dur + 3 * 90) requestAnimationFrame(step)
    else { lines.forEach((l) => (l.style.strokeDasharray = 'none')); ghost.remove(); dots(true); ends(false); pulse() }
  }
  requestAnimationFrame(step)
}

/* A change of number, or of period, MORPHS: the line bends into the new one and the colour
   follows it, so the eye sees what changed instead of a blank redraw. */
let morphing = 0
function morph({ dates = false } = {}) {
  const D = ds(), id = ++morphing
  const from = {}, to = {}
  for (const k of KEYS) { from[k] = pix[k].slice(); to[k] = targetPix(k, S.view === 'all' ? 'all' : k, D) }
  // A line that is joining the chart starts where the line it replaces was (or flat on the floor).
  const lead = shown()[0]
  for (const k of KEYS) if ($('g-' + k).style.opacity === '0' && shown().includes(k)) from[k] = allView() ? from[k].map(() => H - B) : (pix[prevView] ? pix[prevView].slice() : from[k])
  setColor(); fadeGroups(true); drawAxes(true); if (dates) drawDates(true)
  $('dots').innerHTML = ''; $('ends').innerHTML = ''; $('pinsg').innerHTML = ''
  const start = performance.now(), dur = reduce ? 1 : 760
  $('revealr').setAttribute('width', W)
  const step = (now) => {
    if (id !== morphing) return
    const t = Math.min(1, (now - start) / dur), e = easeIO(t)
    for (const k of KEYS) pix[k] = from[k].map((v, i) => v + (to[k][i] - v) * e)
    renderLines()
    if (t < 1) requestAnimationFrame(step)
    else { dots(true); ends(true); drawPins(true); pinEls.forEach((p, i) => setTimeout(() => popPin(p), 50 * i)); pulse() }
  }
  requestAnimationFrame(step)
}

/* Scrub: the nearest point; one value, or all four with their colours. */
const wrap = $('chartwrap')
const scrubDots = KEYS.map((k) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 5); c.setAttribute('fill', '#fff'); c.setAttribute('style', `stroke:${M[k].c}`); c.setAttribute('stroke-width', 2.5); $('scrubg').appendChild(c); return c })
wrap.addEventListener('pointermove', (ev) => {
  if (ev.target.closest('.pin')) { wrap.classList.remove('scrubbing'); return }
  const D = ds(), n = D.spot.length, rect = svg.getBoundingClientRect(), s = rect.width / W, vx = (ev.clientX - rect.left) / s
  if (vx < L - 10 || vx > W - R + 14) { wrap.classList.remove('scrubbing'); return }
  const i = Math.max(0, Math.min(n - 1, Math.round(((vx - L) / (W - L - R)) * (n - 1)))), x = X(i / (n - 1))
  $('sl').setAttribute('x1', x); $('sl').setAttribute('x2', x)
  let topY = H
  KEYS.forEach((k, j) => {
    const on = shown().includes(k), sc = scaleFor(k, S.view === 'all' ? 'all' : k, D), y = sc.y(D[k][i])
    scrubDots[j].setAttribute('cx', x); scrubDots[j].setAttribute('cy', y); scrubDots[j].style.display = on ? '' : 'none'
    if (on) topY = Math.min(topY, y)
  })
  const date = fmt(d(D.start) + i * D.step * DAY) + (D.wipFrom !== undefined && i >= D.wipFrom ? ' · still counting' : '')
  $('scrubtip').innerHTML = allView()
    ? `<div class="row"><b style="font-size:11px;color:#b8bcc4;font-weight:400">${date}</b></div>` + KEYS.map((k) => `<div class="row"><i style="background:${M[k].c}"></i><b>${M[k].show(D[k][i])}</b><span>${M[k].lab}</span></div>`).join('')
    : `<b>${M[S.view].show(D[S.view][i])}</b><span class="dt">${date}</span>`
  $('scrubtip').style.left = x * s + 'px'; $('scrubtip').style.top = topY * s + 'px'
  wrap.classList.add('scrubbing')
})
wrap.addEventListener('pointerleave', () => wrap.classList.remove('scrubbing'))

/* ═══════════ the page around it ═══════════ */
function countUp(el, text, delay) {
  const m = text.match(/^(\D*)([\d.]+)(.*)$/)
  if (!m || reduce) { el.textContent = text; return }
  const [, pre, num, post] = m, target = parseFloat(num), dec = (num.split('.')[1] || '').length
  const from = pre === '#' ? target + 1.5 : 0, start = performance.now() + delay, dur = 1300
  const step = (now) => { const t = Math.min(1, Math.max(0, (now - start) / dur)); el.textContent = pre + (from + (target - from) * ease(t)).toFixed(dec) + post; if (t < 1) requestAnimationFrame(step) }
  requestAnimationFrame(step)
}
function tiles(animate) {
  const vals = S.data === 'real' ? REAL_TILES : EX_TILES[S.period]
  $('tiles').innerHTML = KEYS.map((k, i) => `
    <button class="tile ${S.view === k ? 'sel' : ''}" role="tab" aria-selected="${S.view === k}" data-k="${k}" style="--mc:${M[k].c}">
      <span class="ico">${icon(M[k].icon)}</span>
      <span><span class="val"><span class="n" id="tn${i}"></span><span class="d ${vals[k][1] === '–' ? 'flat' : ''}" id="td${i}">${vals[k][1]}</span></span><span class="lab"><i></i>${M[k].lab}</span></span>
    </button>`).join('')
  KEYS.forEach((k, i) => { countUp($(`tn${i}`), vals[k][0], animate ? 300 + i * 90 : 0); setTimeout(() => $(`td${i}`).classList.add('show'), reduce ? 0 : animate ? 1500 + i * 90 : 30) })
  $('tiles').querySelectorAll('.tile').forEach((b) => b.addEventListener('click', () => choose(b.dataset.k)))
}
function markTiles() {
  $('tiles').querySelectorAll('.tile').forEach((b) => { const on = b.dataset.k === S.view; b.classList.toggle('sel', on); b.setAttribute('aria-selected', on) })
  $('page').classList.toggle('all-on', allView())
  $('together').classList.toggle('on', allView()); $('together').setAttribute('aria-pressed', allView())
  const ok = enoughForAll(); $('together').classList.toggle('off', !ok); $('together').setAttribute('aria-disabled', !ok); $('together').title = ok ? 'All four at once, as progress' : 'Ready with 4 weeks of numbers'
  const u = $('unit')
  u.innerHTML = allView() ? `${icon('up')} All four as progress · hover for the numbers` : `<i style="width:8px;height:8px;border-radius:50%;background:${M[S.view].c};display:inline-block"></i>${M[S.view].unit}`
  u.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduce ? 1 : 300 })
}
let prevView = 'spot'
function choose(k) { if (k === S.view || S.chart !== 'climb') return; prevView = S.view; S.view = k; markTiles(); morph() }
// "All 4" compares how far each number has come. With a week of daily numbers, that only blows
// day-to-day wiggles up into full swings, so it waits for 4 weeks.
const enoughForAll = () => { const D = ds(); return (D.spot.length - 1) * D.step >= 28 }
$('together').addEventListener('click', () => { if (!enoughForAll()) return; choose(allView() ? prevView === 'all' ? 'spot' : prevView : 'all') })
function verdict() {
  const real = S.data === 'real', b = $('badge')
  b.classList.toggle('wait', real); b.classList.remove('go')
  $('badge-ic').innerHTML = real ? '<use href="#i-clock"/>' : '<use href="#i-check"/>'
  $('vt').textContent = real ? 'Too early to tell' : 'Climbing on Google'
  $('vs').textContent = real ? 'Google started counting Sep 29. Back on Oct 27.' : 'Higher, more often, for more searches'
  if (!real) { void b.offsetWidth; setTimeout(() => b.classList.add('go'), reduce ? 0 : 1900) }
}
function lower() {
  const k = S.data === 'real' ? 'real' : 'ex'
  $('searches').innerHTML = SEARCHES[k].map(([q, tr, rk, mv]) => {
    const mn = Math.min(...tr, 1), mx = Math.max(...tr) + .2
    const pts = tr.map((v, i) => `${(i / Math.max(1, tr.length - 1)) * 80 + 2},${((v - mn) / (mx - mn)) * 16 + 3}`).join(' ')
    return `<div class="srch"><span>${q}</span><svg class="spark" viewBox="0 0 84 22"><polyline points="${pts}" fill="none" style="stroke:var(--c1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="rk">${rk}</span><span class="mv ${mv === 'new' ? 'newb' : mv === '–' ? 'flat' : ''}">${mv}</span></div>`
  }).join('')
  const ai = AI[k], max = Math.max(1, ...ai.map((a) => a[1]))
  $('ai').innerHTML = ai.map(([n, c]) => `<div class="ai-row ${c ? '' : 'zero'}"><span>${n}</span><span class="meter"><i data-w="${c / max}"></i></span><span class="c">${c}</span></div>`).join('')
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.ai-row .meter i').forEach((i) => (i.style.transform = `scaleX(${i.dataset.w})`))))
  $('clk').textContent = S.data === 'real' ? '25' : '61'
}
function knob() { const on = $('periods').querySelector('button.on'), k = $('knob'); k.style.left = on.offsetLeft + 'px'; k.style.width = on.offsetWidth + 'px' }

/* ═══════════ Replay ═══════════ */
let rp = { t: 0, playing: false, raf: 0, last: 0, passed: new Set() }
function replaySet() {
  const D = ds(), rows = Math.max(4, Math.ceil(Math.max(...D.spot)) + 1)
  $('lanes').innerHTML = Array.from({ length: rows }, (_, i) => `<div class="lane"><span class="k">#${i + 1}</span><div class="sk"><i style="width:${38 + ((i * 37) % 30)}%"></i><i style="width:${60 + ((i * 23) % 25)}%;opacity:.6"></i></div></div>`).join('') +
    `<div class="me" id="mecard"><span class="av">S</span><div><div class="t">Skeen · Chicago house DJ and producer</div><div class="u">skeenmusic.com</div></div></div>`
  const n = D.spot.length, t0 = d(D.start), span = (n - 1) * D.step * DAY
  $('tpins').innerHTML = pins().map((p) => `<span class="tp ${p.auto ? 'auto' : ''}" data-u="${(d(p.date) - t0) / span}" title="${p.title}" style="left:${((d(p.date) - t0) / span) * 100}%">${icon(p.icon)}</span>`).join('') +
    Array.from({ length: n }, (_, i) => (i % (n > 10 ? 3 : 1) && i !== n - 1 ? '' : `<span class="tl" style="left:${(i / (n - 1)) * 100}%;${i === 0 ? 'transform:none' : i === n - 1 ? 'transform:translateX(-100%)' : ''}">${fmt(t0 + i * D.step * DAY)}</span>`)).join('')
  rp.passed = new Set(); replayAt(0)
}
function replayAt(t) {
  rp.t = t
  const D = ds(), n = D.spot.length, x = t * (n - 1), r = monotone(D.spot)(x)
  $('mecard').style.transform = `translateY(${(r - 1) * 62 + 4}px)`
  $('rbig').textContent = r.toFixed(1); $('rseen').textContent = Math.round(monotone(D.seen)(x))
  $('rwhen').textContent = fmt(d(D.start) + x * D.step * DAY)
  $('fill').style.width = t * 100 + '%'; $('head').style.left = t * 100 + '%'
  const ps = pins()
  document.querySelectorAll('#tpins .tp').forEach((el, i) => { const u = +el.dataset.u; if (t >= u && !rp.passed.has(i)) { rp.passed.add(i); if (rp.playing) flash(el, ps[i]) } if (t < u) rp.passed.delete(i) })
}
function flash(el, p) {
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 420)
  $('toast').innerHTML = `<span class="ci">${icon(p.icon)}</span>${p.title}`
  $('toast').classList.add('show'); clearTimeout(rp.tt); rp.tt = setTimeout(() => $('toast').classList.remove('show'), 1700)
}
function play() {
  if (rp.t >= 1) replayAt(0)
  rp.playing = true; $('playic').innerHTML = '<use href="#i-pause"/>'; rp.last = performance.now()
  const step = (now) => { if (!rp.playing) return; const t = Math.min(1, rp.t + (now - rp.last) / 6500); rp.last = now; replayAt(t); if (t < 1) rp.raf = requestAnimationFrame(step); else pause() }
  rp.raf = requestAnimationFrame(step)
}
function pause() { rp.playing = false; cancelAnimationFrame(rp.raf); $('playic').innerHTML = '<use href="#i-play"/>' }
$('play').addEventListener('click', () => (rp.playing ? pause() : play()))
const track = $('track'), seek = (ev) => { const r = track.getBoundingClientRect(); replayAt(Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width))) }
track.addEventListener('pointerdown', (ev) => { pause(); track.setPointerCapture(ev.pointerId); seek(ev); track.onpointermove = seek })
track.addEventListener('pointerup', () => (track.onpointermove = null))
function typeQuery(done) {
  const q = 'skeen dj', el = $('qtext'); el.textContent = ''
  if (reduce) { el.textContent = q; done(); return }
  let i = 0; const tick = () => { el.textContent = q.slice(0, ++i); if (i < q.length) setTimeout(tick, 70); else setTimeout(done, 350) }
  setTimeout(tick, 300)
}

/* ═══════════ wiring ═══════════ */
function boot() { if (S.view === 'all' && !enoughForAll()) S.view = 'spot'; verdict(); tiles(true); markTiles(); lower(); if (S.chart === 'climb') intro(); else { pause(); replaySet(); typeQuery(play) } }
document.querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => {
  if (S.data === 'real' || b.classList.contains('on')) return
  document.querySelectorAll('[data-p]').forEach((x) => x.classList.toggle('on', x === b)); S.period = b.dataset.p; knob()
  tiles(false); markTiles()
  if (S.chart === 'climb') morph({ dates: true }); else { pause(); replaySet(); play() }
}))
document.querySelectorAll('[data-chart]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-chart]').forEach((x) => x.classList.toggle('on', x === b)); S.chart = b.dataset.chart
  if (S.chart === 'replay') S.view = 'spot'
  $('page').classList.toggle('show-replay', S.chart === 'replay'); boot()
}))
document.querySelectorAll('[data-data]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-data]').forEach((x) => x.classList.toggle('on', x === b)); S.data = b.dataset.data
  S.period = S.data === 'real' ? '28d' : '3m'
  document.querySelectorAll('[data-p]').forEach((x) => x.classList.toggle('on', x.dataset.p === S.period)); knob(); boot()
}))
const qs = new URLSearchParams(location.search)
if (qs.get('data') === 'real') { S.data = 'real'; S.period = '28d'; document.querySelectorAll('[data-data]').forEach((x) => x.classList.toggle('on', x.dataset.data === 'real')); document.querySelectorAll('[data-p]').forEach((x) => x.classList.toggle('on', x.dataset.p === '28d')) }
if (qs.get('view')) S.view = qs.get('view')
if (qs.get('chart') === 'replay') { S.chart = 'replay'; $('page').classList.add('show-replay'); document.querySelectorAll('[data-chart]').forEach((x) => x.classList.toggle('on', x.dataset.chart === 'replay')) }
document.fonts.ready.then(() => { knob(); boot() })
</script>
