<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview Mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Overview on the Brand page's grammar (Sam, 2026-10-02: yes, "mock first").
   TODAY = screenshots of localhost:3000 (Skeen, 2026-10-02): the Overview, and Brand as the reference.
   PROPOSED = a 1440×900 window drawn with the live classes: ledger.tsx (LedgerSection, LedgerRow),
   disclosure.tsx (the A row, as a link), row-icon.tsx (bare glyphs, pencil revealed on hover),
   publish-riser.tsx, tools-rail.tsx. The tool list follows toolsFor(customSite). Tokens: globals.css.
   The frame is copied from prototypes/batch3_20261002.html. */
:root{--paper:#fff;--surface:#fafafa;--hover:#f6f7f8;--ink:#111;--muted:#6b7280;--faint:#9aa0a6;--hair:#ececec;--hair-soft:#f1f1f3;--accent:#2563eb;--red:#e5484d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--paper:#111;--surface:#171717;--hover:#1e1e1e;--ink:#f2f2f2;--muted:#a3a7ad;--faint:#6f7378;--hair:#2a2a2a;--hair-soft:#222;--accent:#7aa2ff}}
:root[data-theme=dark]{color-scheme:dark;--paper:#111;--surface:#171717;--hover:#1e1e1e;--ink:#f2f2f2;--muted:#a3a7ad;--faint:#6f7378;--hair:#2a2a2a;--hair-soft:#222;--accent:#7aa2ff}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .15s}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#111;color:#fff;font:500 12px/1 "Instrument Sans",system-ui,sans-serif;padding:6px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;z-index:90}
[data-tip]:hover::after,[data-tip]:focus-visible::after{display:block}

/* ── prototype chrome (not the product) ── */
.proto{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--hair)}
.proto .t{font:10px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.vs{display:flex;flex:none;gap:2px;padding:3px;border:1px solid var(--hair);border-radius:10px;background:var(--paper);overflow-x:auto;max-width:100%;scrollbar-width:none}
.vs button{padding:5px 11px;border-radius:7px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.vs button:hover{color:var(--ink)}
.vs button.on{background:var(--ink);color:var(--paper)}
.what{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px 0;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);border-radius:99px;padding:2px 9px;font:11px "Space Mono",monospace;color:var(--accent);white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--accent)}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px 16px 24px}
body[data-view=today] .cmp,body[data-view=proposed] .cmp{grid-template-columns:minmax(0,1440px);justify-content:center}
body[data-view=today] .col.p,body[data-view=proposed] .col.t{display:none}
@media (max-width:900px){.cmp{grid-template-columns:1fr}}
.col{min-width:0}
.cap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:28px;font:10px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.mini{display:flex;gap:4px}
.mini button{padding:2px 8px;border-radius:6px;font:10px "Space Mono",monospace;letter-spacing:.06em;color:var(--faint)}
.mini button.on{color:var(--ink);background:var(--hover)}
.fit{position:relative;width:100%;overflow:hidden;border:1px solid var(--hair);border-radius:10px;background:#fff}
.full{max-width:1474px;margin:0 auto;padding:8px 16px 48px}
.full .fit{max-width:1442px}

/* ── THE WINDOW: 1440×900, always the desktop layout, always light (the app has no dark tokens) ── */
.win{--paper:#fff;--surface:#fafafa;--hover:#f6f7f8;--ink:#111;--muted:#6b7280;--faint:#9aa0a6;--hair:#ececec;--hair-soft:#f1f1f3;--accent:#2563eb;--red:#e5484d;
  color-scheme:light;position:absolute;left:0;top:0;width:1440px;height:900px;overflow:hidden;transform-origin:0 0;background:var(--paper);color:var(--ink)}
.shot{position:absolute;inset:0;overflow-y:auto;scrollbar-width:thin}
.shot img{display:block;width:1440px}

/* header (dashboard layout.tsx) */
.hdr{position:absolute;left:0;right:0;top:0;z-index:30;height:71px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;border-bottom:1px solid var(--hair);background:var(--paper)}
.who{display:flex;align-items:center;gap:8px}
.who .bk{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;color:var(--muted)}
.who b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.av{display:inline-flex;flex:none;align-items:center;justify-content:center;border-radius:50%;background:#ececef;color:#3f3f46;font-family:"Space Mono",monospace;font-weight:700}
.anav{display:flex;gap:2px}
.anav span{display:inline-flex;padding:10px;color:var(--muted)}
.anav span.on{color:var(--accent)}
.hdot{position:absolute;right:4px;top:6px;width:6px;height:6px;border-radius:50%;background:#d99a2b}
.tr{display:flex;justify-content:flex-end;align-items:center;gap:14px;color:var(--muted)}

/* tools rail (tools-rail.tsx), toolsFor(true): no Site & profile. Hover = colour + a bolder stroke only. */
.rail{position:absolute;left:0;top:71px;bottom:0;z-index:20;width:84px;border-right:1px solid var(--hair);background:var(--paper)}
.rail .rc{position:absolute;left:0;right:0;top:379px;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:0 6px}
.rail a{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;color:var(--muted);transition:color .15s}
.rail a:hover{color:var(--ink)}
.rail a:hover .ic{stroke-width:2.1}
.rail a.on{color:var(--accent)}
.rail a span{max-width:84px;overflow:hidden;white-space:nowrap;font:10px/12px "Space Mono",monospace;letter-spacing:.02em}

/* main: the ONE frame (max-w 1180, left, pb-28) */
.scroll{position:absolute;left:0;right:0;top:71px;bottom:0;overflow-y:auto;padding:32px 28px 0 144px;scrollbar-width:thin}
.wrap{max-width:1180px;padding-bottom:112px}

/* LEDGER (ledger.tsx), the ≥900px layout */
.sec{display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:32px;padding:8px 0 28px;border-bottom:1px solid var(--hair)}
.sec:last-of-type{border-bottom:0}
.sec h2{margin:0;padding-top:22px;font:400 11px "Space Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rows{display:flex;flex-direction:column;min-width:0}
.row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,1.4fr);align-items:center;gap:24px;padding:16px 0;border-bottom:1px solid var(--hair-soft)}
.rows>.row:last-child{border-bottom:0}
.row .t{white-space:nowrap;font-size:15px;font-weight:500;color:var(--ink)}
.row .m{margin-top:4px;font:11px "Space Mono",monospace;color:var(--faint)}
.ctl{display:flex;min-width:0;align-items:center;justify-content:flex-end;gap:18px}
/* bare glyph (row-icon.tsx variant="bare"): ink at rest, colour + a bolder stroke on hover, no box */
.bare{position:relative;display:inline-flex;border-radius:4px;color:var(--ink);transition:color .15s,opacity .15s}
.bare:hover{color:var(--accent)}
.bare:hover .ic{stroke-width:2.1}
/* the pencil: hidden until its row is hovered (REVEAL_ON_HOVER), 14px */
.reveal{opacity:0}
.row:hover .reveal,.reveal:focus-visible{opacity:1}
@media (hover:none){.reveal{opacity:1}}
/* status: ✓ Live (ink) or ● N waiting (blue = pending) */
.stat{display:inline-flex;align-items:center;gap:7px;font:12px "Space Mono",monospace;color:var(--muted);white-space:nowrap}
.stat i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.stat.live{color:var(--ink)}

/* THE A ROW (_ui/disclosure.tsx), here a link: mark · name · value · chevron */
.dl{margin:0 -12px}
.di{border-radius:12px}
.di:not(:first-child){box-shadow:0 -1px 0 var(--hair-soft)}
.db{display:flex;width:100%;align-items:center;gap:14px;border-radius:12px;padding:12px;text-align:left;transition:background-color .15s}
.db:hover{background:var(--surface)}
.dmk{display:flex;width:20px;flex:none;justify-content:center;color:var(--muted);transition:color .15s}
.db:hover .dmk{color:var(--ink)}
.dn{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-size:15px;font-weight:500;line-height:1.35}
.pd{width:6px;height:6px;flex:none;border-radius:50%;background:var(--accent)}
.dv{flex:none;font:12px "Space Mono",monospace;color:var(--faint);white-space:nowrap}
.dv.on{color:var(--ink)}
.chev{flex:none;color:var(--faint);transition:color .15s}
.db:hover .chev{color:var(--ink)}

/* THE PUBLISH RISER (publish-riser.tsx), at the window's bottom edge */
.riser{position:absolute;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 32px;border-top:1px solid var(--hair);background:var(--paper);visibility:hidden;transform:translateY(110%);transition:transform .2s ease-out,visibility .2s}
.riser.up{visibility:visible;transform:none;box-shadow:0 -8px 24px rgba(0,0,0,.05)}
.riser p{margin:0;display:flex;align-items:flex-start}
.riser p i{margin:6px 10px 0 0;width:9px;height:9px;flex:none;border-radius:50%;background:var(--red)}
.riser p span{font-size:15px;line-height:1.375}
.riser .pb{border:1px solid var(--ink);border-radius:10px;background:var(--ink);padding:10px 22px;font-size:14px;font-weight:500;color:var(--paper)}
</style>
</head>

<script>
const $ = (s, r = document) => r.querySelector(s)

TkSuQmCC']

/* ── Skeen, read off localhost:3000/artists/…/tools on 2026-10-02 (the page's own queries) ── */
const DATA = {
  site: 'skeenmusic.com',          // the custom site; ↗ goes to /skeen, which 308s there
  waiting: ['Connections'],        // DIFF_SECTIONS labels that are dirty (the page's dot sat on Connections)
  links: 1,                        // Connections' own bar: "1 link changed · not on the site yet"
  subscribers: 11,
  unread: 0,
  synced: 2,                       // connectedCount(): Spotify + YouTube, the two the Connections page calls "synced"
}
/* Today's count: dirty route segments (dirtyBySeg), not sections. */
const SEG = { 'Site / profile': 'site', Songs: 'music', Videos: 'videos', 'Tour dates': 'tour', Merch: 'merch', Releases: 'music', Connections: 'connections', Media: 'site', 'Site text': 'site', 'Site styles': 'site', Fonts: 'brand', 'Brand colors': 'brand', 'Browser bar': 'brand' }
const segCount = (waiting) => new Set(waiting.map((w) => SEG[w])).size

/* toolsFor(true) minus Overview, in registry order. Site & profile is templateOnly: gone for a custom site. */
const TOOLS = [
  { seg: 'profile', icon: 'user', label: 'Profile' },
  { seg: 'brand', icon: 'sparkles', label: 'Brand' },
  { seg: 'connections', icon: 'plug', label: 'Connections' },
  { seg: 'tools/seo', icon: 'compass', label: 'SEO / GEO' },
  { seg: 'epk', icon: 'package', label: 'Press kit' },
  { seg: 'subscribers', icon: 'userGroup', label: 'Subscribers' },
  { seg: 'enquiries', icon: 'mailbox', label: 'Enquiries' },
  { seg: 'settings', icon: 'settings', label: 'Settings' },
]

/* A tool's unpublished dot. The diff's 'site' segment (profile, site text, photos) is what Profile's
   own Publish bar ships, so it dots Profile now that Site & profile is gone. */
function dotFor(seg, waiting) {
  const has = (labels) => waiting.some((w) => labels.includes(w))
  if (seg === 'profile') return has(['Site / profile', 'Site text', 'Media', 'Site styles'])
  if (seg === 'brand') return has(['Fonts', 'Brand colors', 'Browser bar'])
  if (seg === 'connections') return has(['Connections'])
  return false
}
function valueFor(seg) {
  if (seg === 'connections') return [`${DATA.synced} synced`, false]
  if (seg === 'subscribers') return [String(DATA.subscribers), false]
  if (seg === 'enquiries') return [`${DATA.unread} unread`, DATA.unread > 0]
  return ['', false]
}
/* What the riser names: the waiting sections, in DIFF_SECTIONS order, one word each, de-duplicated. */
const SAY = { 'Site / profile': 'profile', Songs: 'songs', Videos: 'videos', 'Tour dates': 'tour dates', Merch: 'merch', Releases: 'releases', Connections: `${DATA.links} link${DATA.links === 1 ? '' : 's'}`, Media: 'photos', 'Site text': 'site text', 'Site styles': 'site styles', Fonts: 'fonts', 'Brand colors': 'colors', 'Browser bar': 'browser bar' }
function riserMsg(waiting) {
  const parts = [...new Set(waiting.map((w) => SAY[w] || w.toLowerCase()))]
  if (!parts.length) return ''
  const list = parts.length === 1 ? parts[0] : `${parts.slice(0, -1).join(', ')} and ${parts[parts.length - 1]}`
  return `${list[0].toUpperCase()}${list.slice(1)} changed · not on the site yet`
}

function windowHTML(waiting) {
  const n = segCount(waiting)
  const status = n
    ? `<span class="stat"><i></i>${n} unpublished</span>`
    : `<span class="stat live">${ic('i-check', 15)}Live</span>`
  const tools = TOOLS.map((t) => {
    const [v, on] = valueFor(t.seg)
    return `<div class="di"><a class="db" href="#" aria-label="${t.label}${v ? ', ' + v : ''}">
      <span class="dmk">${ic('i-' + t.icon, 18)}</span>
      <span class="dn">${t.label}${dotFor(t.seg, waiting) ? '<i class="pd" title="Unpublished changes" aria-label="Unpublished changes"></i>' : ''}</span>
      ${v ? `<span class="dv${on ? ' on' : ''}">${v}</span>` : ''}
      ${ic('i-chevronRight', 14, 'ic chev')}
    </a></div>`
  }).join('')
  const msg = riserMsg(waiting)
  return `<div class="win">
    <header class="hdr">
      <span class="who"><span class="bk">${ic('i-chevronLeft', 18)}</span><span class="av" style="width:24px;height:24px;font-size:8px">S</span><b>Skeen</b></span>
      <nav class="anav" aria-label="Artist">
        <span>${ic('i-analytics', 20)}</span><span>${ic('i-folder', 20)}</span><span>${ic('i-edit', 20)}</span>
        <span>${ic('i-tour', 20)}</span><span>${ic('i-merch', 20)}</span><span class="on" style="position:relative">${ic('i-tools', 20)}${waiting.length ? '<i class="hdot"></i>' : ''}</span>
      </nav>
      <div class="tr">${ic('i-search', 18)}${ic('i-settings', 18)}<span class="av" style="width:30px;height:30px;font-size:10px">S</span></div>
    </header>
    <nav class="rail" aria-label="Manager tools"><div class="rc">
      <a href="#" class="on">${ic('i-home', 20)}<span>Overview</span></a>
      ${TOOLS.map((t) => `<a href="#">${ic('i-' + t.icon, 20)}<span>${t.label === 'SEO / GEO' ? 'SEO/GEO' : t.label}</span></a>`).join('')}
    </div></nav>
    <div class="scroll"><div class="wrap">
      <section class="sec">
        <h2>Site</h2>
        <div class="rows">
          <div class="row">
            <div><div class="t">Site</div><div class="m">${DATA.site}</div></div>
            <div class="ctl">
              ${status}
              <a class="bare" href="#" data-tip="View site" aria-label="View site">${ic('i-external', 20)}</a>
              <a class="bare" href="#" data-tip="Preview" aria-label="Preview">${ic('i-eye', 20)}</a>
              <a class="bare reveal" href="#" data-tip="Edit site" aria-label="Edit site">${ic('i-edit', 14)}</a>
            </div>
          </div>
        </div>
      </section>
      <section class="sec">
        <h2>Tools</h2>
        <div class="rows"><div class="dl">${tools}</div></div>
      </section>
    </div></div>
    <div class="riser${msg ? ' up' : ''}" aria-hidden="${msg ? 'false' : 'true'}"><p><i></i><span>${msg}</span></p><button class="pb">Publish</button></div>
  </div>`
}

function render() {
  const waiting = document.body.dataset.state === 'live' ? [] : DATA.waiting
  $$('[data-window]').forEach((f) => (f.innerHTML = windowHTML(waiting)))
  fit()
}
function fit() {
  $$('.fit').forEach((f) => {
    if (!f.offsetParent) return
    const s = Math.min(1, f.clientWidth / 1440)
    $('.win', f).style.transform = `scale(${s})`
    f.style.height = `${Math.round(900 * s)}px`
  })
}

$('#whatLine').textContent = 'Cards → two ledger sections · counts sit on their tool rows · word buttons → ↗ · eye · pencil · no captions'
$('#shot').src = SHOTS[0]
$('#mini').addEventListener('click', (e) => {
  const b = e.target.closest('[data-shot]'); if (!b) return
  $$('#mini button').forEach((x) => x.classList.toggle('on', x === b))
  $('#shot').src = SHOTS[+b.dataset.shot]; $('.shot').scrollTop = 0
})
$$('#viewSw button').forEach((b) => b.addEventListener('click', () => {
  document.body.dataset.view = b.dataset.view
  $$('#viewSw button').forEach((x) => x.classList.toggle('on', x === b))
  $('#full').hidden = b.dataset.view === 'proposed' || b.dataset.view === 'today'
  fit()
}))
$$('#stateSw button').forEach((b) => b.addEventListener('click', () => {
  document.body.dataset.state = b.dataset.state
  $$('#stateSw button').forEach((x) => x.classList.toggle('on', x === b))
  render()
}))
document.addEventListener('click', (e) => { if (e.target.closest('a[href="#"]')) e.preventDefault() })
addEventListener('resize', fit)
render()
</script>
