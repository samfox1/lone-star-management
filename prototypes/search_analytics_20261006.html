<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search and Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Black and white. Colour means ONE thing: which of the four numbers. Four variables, in the
     categorical order the dataviz validator passed for a white page. */
  @property --cur { syntax: '<color>'; inherits: true; initial-value: #2a78d6; }
  :root {
    --paper: #ffffff; --ink: #111111; --ink-2: #6b7280; --ink-3: #9aa0a6; --line: #ececec; --mist: #f4f4f5;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 6px; }
  svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

  .mockbar { position: sticky; top: 0; z-index: 50; display: flex; gap: 28px; align-items: center; padding: 12px 40px; background: #fafafa; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
  .mockbar .grp { display: flex; gap: 6px; align-items: center; }
  .mockbar .grp > span { margin-right: 4px; }
  .mockbar button { padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-size: 12px; }
  .mockbar button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .is-analytics .search-only { display: none !important; }

  .page { max-width: 1180px; padding: 36px 40px 80px; }

  /* quiet controls: words and glyphs, the current one ink; no boxes */
  .top { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
  .engines { display: flex; gap: 14px; align-items: center; }
  .eng { position: relative; color: var(--ink-3); transition: color .2s; padding: 4px; }
  .eng svg { width: 18px; height: 18px; }
  .eng.on, .eng:hover { color: var(--ink); }
  .eng .pend { position: absolute; top: 1px; right: -2px; width: 6px; height: 6px; border-radius: 50%; background: #d99a2b; }
  .periods { position: relative; display: flex; gap: 18px; }
  .periods button { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-3); padding: 6px 0; transition: color .25s; }
  .periods button:hover { color: var(--ink); }
  .periods button.on { color: var(--ink); font-weight: 700; }
  .uline { position: absolute; bottom: -2px; height: 2px; border-radius: 2px; background: var(--ink); transition: left .45s var(--ease), width .45s var(--ease), background .35s; }

  .verdict { display: flex; align-items: center; gap: 14px; margin-top: 30px; }
  .badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; flex: none; }
  .badge.wait { background: var(--mist); color: var(--ink-2); }
  .badge svg { width: 22px; height: 22px; stroke-width: 2.1; }
  .badge path.draw { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .badge.go path.draw { animation: draw .6s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .vt { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .vs { font-size: 14px; color: var(--ink-3); margin-top: 2px; }

  /* The four numbers are the chart's switch and its legend. Bare glyphs, no box. */
  .tiles { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 30px; padding-bottom: 14px; }
  .tile { display: flex; gap: 14px; align-items: center; padding: 6px 4px; text-align: left; }
  .tile .ico { width: 30px; height: 30px; flex: none; color: var(--ink); transition: color .35s, transform .35s var(--ease); }
  .tile .ico svg { width: 30px; height: 30px; stroke-width: 1.5; }
  .tile:hover .ico svg { stroke-width: 2; }
  .tile.sel .ico, .all-on .tile .ico { color: var(--mc); }
  .tile.sel .ico { transform: scale(1.06); }
  .tile .val { display: flex; align-items: baseline; gap: 10px; }
  .tile .n { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 30px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile .d { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; opacity: 0; transform: translateY(4px); transition: opacity .4s, transform .4s var(--ease); white-space: nowrap; }
  .tile .d.show { opacity: 1; transform: none; }
  .tile .d.flat { color: var(--ink-3); font-weight: 400; }
  .tile .lab { font-size: 13px; color: var(--ink-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .tile .lab i { width: 7px; height: 7px; border-radius: 50%; background: var(--mc); display: none; }
  .all-on .tile .lab i { display: inline-block; animation: popin .35s var(--ease); }
  @keyframes popin { from { transform: scale(0); } }
  .tiles .uline { bottom: 0; height: 2.5px; background: var(--mc, var(--ink)); }
  .all-on .tiles .uline { opacity: 0; }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-top: 26px; }
  .unit { font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .together { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); transition: color .25s; flex: none; padding: 4px 0; }
  .together:hover { color: var(--ink); }
  .together.on { color: var(--ink); font-weight: 600; }
  .together .dots { display: inline-grid; grid-template-columns: repeat(2, 6px); gap: 2px; }
  .together .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .chartwrap { position: relative; margin-top: 4px; }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .ax { font-family: 'Space Mono', monospace; font-size: 11px; fill: var(--ink-3); }
  .scrub { pointer-events: none; opacity: 0; transition: opacity .15s; }
  .scrubbing .scrub { opacity: 1; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 12px; padding: 8px 11px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -100%) translateY(-16px); opacity: 0; transition: opacity .15s; }
  .tip b { font-family: 'Space Mono', monospace; font-size: 13px; }
  .tip .dt { color: #b8bcc4; margin-left: 8px; font-family: 'Space Mono', monospace; font-size: 11px; }
  .tip .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .tip .row:first-child { margin-top: 0; }
  .tip .row i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tip .row span { color: #b8bcc4; }
  .scrubbing .tip.scrubtip { opacity: 1; }

  .pin { cursor: pointer; }
  .pin .bub { transition: transform .3s var(--ease); transform-box: fill-box; transform-origin: center; }
  .pin:hover .bub, .pin:focus .bub { transform: scale(1.12); }
  .card { position: absolute; z-index: 5; width: 280px; padding: 14px 16px; border-radius: 14px; background: #fff; box-shadow: 0 10px 30px rgba(17,17,17,.12), 0 0 0 1px rgba(17,17,17,.05); opacity: 0; transform: translate(-50%, calc(-100% - 22px)) scale(.96); transform-origin: bottom center; transition: opacity .22s, transform .32s var(--ease); pointer-events: none; }
  .card.show { opacity: 1; transform: translate(-50%, calc(-100% - 26px)) scale(1); }
  .card .h { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
  .card .ci { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; flex: none; }
  .card .ci.auto { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .card .ci svg { width: 14px; height: 14px; }
  .card .when { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-3); margin: 8px 0 0 38px; }
  .card .move { display: flex; align-items: center; gap: 8px; margin: 8px 0 0 38px; font-family: 'Space Mono', monospace; font-size: 13px; }
  .card .move i { width: 8px; height: 8px; border-radius: 50%; }
  .card .move .a { color: var(--ink-3); }
  .card .move .b { font-weight: 700; }

  /* Replay (Search only) */
  .replay { display: none; grid-template-columns: minmax(0, 1fr) 280px; gap: 56px; align-items: start; margin-top: 30px; --accent: var(--c1); }
  .show-replay .replay { display: grid; }
  .show-replay .climb { display: none; }
  .show-replay .tile { pointer-events: none; }
  .serp { position: relative; border-radius: 20px; background: var(--mist); padding: 22px; }
  .q { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 18px; border-radius: 99px; background: #fff; font-size: 17px; }
  .q svg { width: 17px; height: 17px; }
  .q .caret { width: 1.5px; height: 20px; background: var(--ink); animation: blink 1s steps(1) infinite; margin-left: -6px; }
  @keyframes blink { 50% { opacity: 0; } }
  .lanes { position: relative; margin-top: 16px; }
  .lane { height: 62px; display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 12px; }
  .lane .k { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-3); text-align: right; }
  .lane .sk { height: 42px; border-radius: 12px; background: #fff; opacity: .55; display: flex; flex-direction: column; justify-content: center; gap: 7px; padding: 0 16px; }
  .lane .sk i { display: block; height: 7px; border-radius: 99px; background: #e9e9ec; }
  .me { position: absolute; top: 0; left: 38px; right: 0; height: 54px; border-radius: 14px; background: #fff; display: flex; align-items: center; gap: 12px; padding: 0 14px; box-shadow: 0 8px 24px rgba(17,17,17,.10), 0 0 0 1.5px var(--accent); will-change: transform; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
  .me .t { font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
  .me .u { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 12px); display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 10px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 13px; opacity: 0; transition: opacity .25s, transform .4s var(--ease); white-space: nowrap; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .ci { width: 24px; height: 24px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; }
  .toast .ci svg { width: 13px; height: 13px; }
  .readout .big { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 72px; letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; }
  .readout .big small { font-size: 32px; color: var(--ink-3); letter-spacing: -.02em; margin-right: 2px; }
  .readout .sub { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; margin-top: 10px; }
  .readout .when { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-3); margin-top: 26px; }
  .readout .seen { margin-top: 22px; display: flex; align-items: center; gap: 10px; }
  .readout .seen .n { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 22px; }
  .player { grid-column: 1 / -1; display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: center; margin-top: 4px; }
  .play { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; transition: transform .2s var(--ease); }
  .play:hover { transform: scale(1.06); }
  .play svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
  .track { position: relative; height: 56px; cursor: pointer; touch-action: none; }
  .track .rail { position: absolute; left: 0; right: 0; top: 21px; height: 3px; border-radius: 99px; background: var(--line); }
  .track .fill { position: absolute; left: 0; top: 21px; height: 3px; border-radius: 99px; background: var(--accent); }
  .track .head { position: absolute; top: 14px; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgba(0,0,0,.12); }
  .track .tp { position: absolute; top: 9px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; transition: transform .35s var(--ease); }
  .track .tp.auto { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .track .tp svg { width: 12px; height: 12px; }
  .track .tp.flash { transform: scale(1.3); }
  .track .tl { position: absolute; top: 40px; white-space: nowrap; font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--ink-3); transform: translateX(-50%); }

  /* the lists below the chart: same grammar on both pages */
  .lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px 64px; margin-top: 52px; }
  .sec-h { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14px; margin-bottom: 6px; }
  .sec-h svg { width: 18px; height: 18px; }
  .row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 1.1fr 54px; gap: 14px; align-items: center; height: 48px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row:last-child { border-bottom: 0; }
  .row .g { width: 22px; height: 22px; color: var(--ink); }
  .row .g svg { width: 22px; height: 22px; }
  .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meter { height: 4px; border-radius: 99px; background: var(--mist); overflow: hidden; }
  .row .meter i { display: block; height: 100%; border-radius: 99px; background: var(--ink); transform-origin: left; transform: scaleX(0); transition: transform 1s var(--ease); }
  .row .v { font-family: 'Space Mono', monospace; font-size: 13px; text-align: right; }
  .row.cover { grid-template-columns: 40px minmax(0, 1fr) 1.1fr 54px; height: 56px; }
  .row.cover img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; display: block; }
  .more { margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-3); }
  .devices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 10px; }
  .dev { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding-top: 6px; }
  .dev .big { position: relative; width: 56px; height: 56px; color: var(--ink-3); }
  .dev .big svg { position: absolute; inset: 0; width: 56px; height: 56px; }
  .dev .big .fillw { position: absolute; inset: 0; color: var(--ink); clip-path: inset(100% 0 0 0); transition: clip-path 1.2s var(--ease); }
  .dev .pc { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: -.02em; }
  .dev .nm { font-size: 13px; color: var(--ink-2); margin-top: -6px; }
  .srch { display: grid; grid-template-columns: minmax(0, 1fr) 84px 54px 60px; gap: 14px; align-items: center; height: 48px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .srch:last-child { border-bottom: 0; }
  .srch .spark { width: 84px; height: 22px; }
  .srch .rk { font-family: 'Space Mono', monospace; font-size: 13px; text-align: right; }
  .srch .mv { font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 700; text-align: right; }
  .srch .mv.flat { color: var(--ink-3); font-weight: 400; }
  .srch .mv.newb { justify-self: end; font-weight: 600; font-family: 'Instrument Sans'; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--mist); }
  .clicks { text-decoration: none; display: inline-flex; align-items: center; gap: 10px; margin-top: 44px; font-size: 14px; color: var(--ink-2); transition: color .2s; }
  .clicks:hover { color: var(--ink); }
  .clicks b { color: var(--ink); font-family: 'Space Mono', monospace; }

  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .lower, .replay { grid-template-columns: 1fr; gap: 36px; }
    .page { padding: 28px 16px 60px; }
    .unit { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>

/* ═══════════ shared helpers ═══════════ */
const DAY = 864e5
const d = (s) => Date.parse(s + 'T00:00:00Z')
const fmt = (t) => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' })

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
const ease = (t) => 1 - Math.pow(1 - t, 3)
const easeIO = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)

/* Monotone cubic (Fritsch–Carlson) over the defined points: smooth, never invents a peak. */
function monotone(ys) {
  const n = ys.length
  if (n < 2) return () => ys[0]
  const m = [], c1 = [], c2 = [], c3 = []
  for (let i = 0; i < n - 1; i++) m.push(ys[i + 1] - ys[i])
  c1.push(m[0])
  for (let i = 1; i < n - 1; i++) c1.push(m[i - 1] * m[i] <= 0 ? 0 : (2 * m[i - 1] * m[i]) / (m[i - 1] + m[i]))
  c1.push(m[n - 2])
  for (let i = 0; i < n - 1; i++) { const k = c1[i] + c1[i + 1] - 2 * m[i]; c2.push(m[i] - c1[i] - k); c3.push(k) }
  return (x) => { const i = Math.max(0, Math.min(n - 2, Math.floor(x))), t = x - i; return ys[i] + c1[i] * t + c2[i] * t * t + c3[i] * t * t * t }
}
/* A series with a gap at the START (visitors before Sep 12): the curve covers what was counted. */
function curveOf(vals) {
  const first = vals.findIndex(defined), f = monotone(vals.slice(first))
  return (x) => (x < first - 1e-9 ? null : f(x - first))
}
function niceStep(mx) { const raw = mx / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map((k) => k * p).find((s) => s >= raw) }

/* ═══════════ state ═══════════ */
const S = { page: 'search', data: 'ex', period: '3m', chart: 'climb', view: 'spot', prev: 'spot' }
const P = () => (S.page === 'search' ? SEARCH : ANALYTICS)
const KEYS = () => P().keys
const M = (k) => P().M[k]
const ds = () => (S.page === 'search' ? (S.data === 'real' ? SEARCH.data.real : SEARCH.data.ex[S.period]) : ANALYTICS.data[S.period])
const allView = () => S.view === 'all'
const shown = () => (allView() ? KEYS() : [S.view])
const len = () => ds()[KEYS()[0]].length
function pins() {
  const D = ds(), t0 = d(D.start), t1 = t0 + (len() - 1) * D.step * DAY
  const list = S.page === 'search' ? SEARCH.pins[S.data] : ANALYTICS.pins.filter((p) => allView() || p.k === S.view)
  return list.filter((p) => d(p.date) >= t0 && d(p.date) <= t1)
}

/* ═══════════ geometry ═══════════ */
const W = 1100, H = 380, L = 64, R = 70, T = 54, B = 44, PH = H - T - B, N = 180
const X = (u) => L + u * (W - L - R)
const COLORS = ['--c1', '--c2', '--c3', '--c4']

/* One scale per view. A single number gets its own axis. "All 4" puts each on 0..1: counts from 0
   to their own best, the spot from the bottom rung to #1. Up is better everywhere. */
function scaleFor(k, view) {
  const D = ds(), v = D[k].filter(defined)
  if (M(k).invert) {
    const hi = Math.max(3, Math.ceil(Math.max(...v) + .25))
    const y = (r) => T + ((r - 1) / (hi - 1)) * PH
    if (view === 'all') return { y, ticks: [] }
    return { y, ticks: Array.from({ length: hi }, (_, i) => ({ v: i + 1, lab: '#' + (i + 1), solid: i === hi - 1 })) }
  }
  const mx = Math.max(...v, 0)
  if (view === 'all') return { y: (val) => T + (1 - (mx ? val / mx : 0)) * PH, ticks: [] }
  const step = niceStep(Math.max(mx, 2)), top = Math.max(step * Math.ceil(mx / step), step)
  const ticks = []
  for (let t = 0; t <= top + 1e-9; t += step) ticks.push({ v: t, lab: num(t), solid: t === 0 })
  return { y: (val) => T + (1 - val / top) * PH, ticks }
}
const pix = {}
function targetPix(k, view) {
  const D = ds(), f = curveOf(D[k]), sc = scaleFor(k, view), n = D[k].length
  return Array.from({ length: N + 1 }, (_, i) => { const v = f((i / N) * (n - 1)); return v === null ? null : sc.y(v) })
}
function pathOf(p, from = 0) {
  let out = '', pen = false
  for (let i = from; i < p.length; i++) {
    if (p[i] === null) { pen = false; continue }
    out += `${pen ? 'L' : 'M'}${X(i / N).toFixed(1)},${p[i].toFixed(1)}`; pen = true
  }
  return out
}

/* ═══════════ svg skeleton ═══════════ */
const svg = $('chart')
function buildSvg() {
  svg.innerHTML = `
    <defs>
      <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--cur)" stop-opacity=".18"/><stop offset="1" style="stop-color:var(--cur)" stop-opacity="0"/></linearGradient>
      <clipPath id="reveal"><rect id="revealr" x="0" y="0" width="0" height="${H}"/></clipPath>
      <clipPath id="solid"><rect id="solidr" x="0" y="0" width="${W}" height="${H}"/></clipPath>
    </defs>
    <g id="axes"></g><g id="dates"></g>
    <rect id="band" y="${T - 10}" height="${PH + 10}" style="fill:var(--cur)" opacity="0" rx="10"/>
    <g clip-path="url(#reveal)"><path id="areap" fill="url(#area)"/></g>
    ${KEYS().map((k, i) => `<g id="g-${k}" style="opacity:0"><path id="wip-${k}" fill="none" style="stroke:var(${COLORS[i]})" stroke-width="2.6" stroke-dasharray="1 7" stroke-linecap="round" opacity="0"/><path id="ln-${k}" clip-path="url(#solid)" fill="none" style="stroke:var(${COLORS[i]})" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>`).join('')}
    <g id="dots"></g>
    <g class="scrub" id="scrubg"><line id="sl" y1="${T - 16}" y2="${H - B}" stroke="#111" stroke-opacity=".18"/></g>
    <g id="ends"></g><g id="pinsg"></g>`
  scrubDots = KEYS().map((k, i) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 5); c.setAttribute('fill', '#fff'); c.setAttribute('style', `stroke:var(${COLORS[i]})`); c.setAttribute('stroke-width', 2.5); $('scrubg').appendChild(c); return c })
}
let scrubDots = []
const xWip = () => { const D = ds(); return D.wipFrom === undefined ? W : X((D.wipFrom - 1) / (len() - 1)) }

function drawAxes(animate) {
  const g = document.createElementNS(NS, 'g')
  if (allView()) {
    g.innerHTML = [0, .5, 1].map((p) => `<line x1="${L}" x2="${W - R + 30}" y1="${T + p * PH}" y2="${T + p * PH}" stroke="var(--line)" ${p === 1 ? '' : 'stroke-dasharray="2 6"'}/>`).join('') +
      `<text class="ax" x="${L - 16}" y="${T + 4}" text-anchor="end">best</text><text class="ax" x="${L - 16}" y="${T + PH + 4}" text-anchor="end">0</text>`
  } else {
    const sc = scaleFor(S.view, S.view)
    g.innerHTML = sc.ticks.map((t) => `<line x1="${L}" x2="${W - R + 30}" y1="${sc.y(t.v)}" y2="${sc.y(t.v)}" stroke="var(--line)" ${t.solid ? '' : 'stroke-dasharray="2 6"'}/><text class="ax" x="${L - 16}" y="${sc.y(t.v) + 4}" text-anchor="end">${t.lab}</text>`).join('')
  }
  const box = $('axes'), old = [...box.children]
  box.appendChild(g)
  if (animate && !reduce) {
    g.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.22,.8,.24,1)' })
    old.forEach((o) => o.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' }).finished.then(() => o.remove()))
  } else old.forEach((o) => o.remove())
}
function drawDates(animate) {
  const D = ds(), g = $('dates'), n = len(); g.innerHTML = ''
  const every = n > 20 ? 5 : n > 10 ? 2 : 1
  const at = []; for (let i = 0; i < n; i += every) at.push(i)
  if (at[at.length - 1] !== n - 1) { if (n - 1 - at[at.length - 1] < every / 2) at.pop(); at.push(n - 1) }
  for (const i of at) {
    const t = document.createElementNS(NS, 'text')
    t.setAttribute('class', 'ax'); t.setAttribute('x', X(i / (n - 1))); t.setAttribute('y', H - 12); t.setAttribute('text-anchor', 'middle')
    t.textContent = fmt(d(D.start) + i * D.step * DAY)
    if (animate && !reduce) t.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 120 + i * 15, fill: 'backwards' })
    g.appendChild(t)
  }
}
function renderLines() {
  const xw = xWip(), k0 = Math.round(((xw - L) / (W - L - R)) * N)
  $('solidr').setAttribute('width', xw + 1.5)
  for (const k of KEYS()) {
    if (!pix[k]) continue
    $('ln-' + k).setAttribute('d', pathOf(pix[k]))
    const w = $('wip-' + k)
    if (xw < W) { w.setAttribute('d', pathOf(pix[k], k0)); w.setAttribute('opacity', 1) } else w.setAttribute('opacity', 0)
  }
  if (!allView() && pix[S.view]) {
    const p = pix[S.view], first = p.findIndex(defined)
    $('areap').setAttribute('d', pathOf(p) + `L${X(1)},${H - B}L${X(first / N)},${H - B}Z`)

}

/* ═══════════ Replay (Search only) ═══════════ */
let rp = { t: 0, playing: false, raf: 0, last: 0, passed: new Set() }
function replaySet() {
  const D = ds(), rows = Math.max(4, Math.ceil(Math.max(...D.spot)) + 1)
  $('lanes').innerHTML = Array.from({ length: rows }, (_, i) => `<div class="lane"><span class="k">#${i + 1}</span><div class="sk"><i style="width:${38 + ((i * 37) % 30)}%"></i><i style="width:${60 + ((i * 23) % 25)}%;opacity:.6"></i></div></div>`).join('') +
    `<div class="me" id="mecard"><span class="av">S</span><div><div class="t">Skeen · Chicago house DJ and producer</div><div class="u">skeenmusic.com</div></div></div>`
  const n = D.spot.length, t0 = d(D.start), span = (n - 1) * D.step * DAY
  $('tpins').innerHTML = pins().map((p) => `<span class="tp ${p.auto ? 'auto' : ''}" data-u="${(d(p.date) - t0) / span}" title="${p.title}" style="left:${((d(p.date) - t0) / span) * 100}%">${icon(p.icon)}</span>`).join('') +
    Array.from({ length: n }, (_, i) => (i % (n > 10 ? 3 : 1) && i !== n - 1 ? '' : `<span class="tl" style="left:${(i / (n - 1)) * 100}%;${i === 0 ? 'transform:none' : i === n - 1 ? 'transform:translateX(-100%)' : ''}">${fmt(t0 + i * D.step * DAY)}</span>`)).join('')
  rp.passed = new Set(); replayAt(0)
}
function replayAt(t) {
  rp.t = t
  const D = ds(), n = D.spot.length, x = t * (n - 1), r = monotone(D.spot)(x)
  $('mecard').style.transform = `translateY(${(r - 1) * 62 + 4}px)`
  $('rbig').textContent = r.toFixed(1); $('rseen').textContent = Math.round(monotone(D.seen)(x))
  $('rwhen').textContent = fmt(d(D.start) + x * D.step * DAY)
  $('fill').style.width = t * 100 + '%'; $('head').style.left = t * 100 + '%'
  const ps = pins()
  document.querySelectorAll('#tpins .tp').forEach((el, i) => { const u = +el.dataset.u; if (t >= u && !rp.passed.has(i)) { rp.passed.add(i); if (rp.playing) flash(el, ps[i]) } if (t < u) rp.passed.delete(i) })
}
function flash(el, p) {
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 420)
  $('toast').innerHTML = `<span class="ci">${icon(p.icon)}</span>${p.title}`
  $('toast').classList.add('show'); clearTimeout(rp.tt); rp.tt = setTimeout(() => $('toast').classList.remove('show'), 1700)
}
function play() {
  if (rp.t >= 1) replayAt(0)
  rp.playing = true; $('playic').innerHTML = '<use href="#i-pause"/>'; rp.last = performance.now()
  const step = (now) => { if (!rp.playing) return; const t = Math.min(1, rp.t + (now - rp.last) / 6500); rp.last = now; replayAt(t); if (t < 1) rp.raf = requestAnimationFrame(step); else pause() }
  rp.raf = requestAnimationFrame(step)
}
function pause() { rp.playing = false; cancelAnimationFrame(rp.raf); $('playic').innerHTML = '<use href="#i-play"/>' }
$('play').addEventListener('click', () => (rp.playing ? pause() : play()))
const track = $('track'), seek = (ev) => { const r = track.getBoundingClientRect(); replayAt(Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width))) }
track.addEventListener('pointerdown', (ev) => { pause(); track.setPointerCapture(ev.pointerId); seek(ev); track.onpointermove = seek })
track.addEventListener('pointerup', () => (track.onpointermove = null))
function typeQuery(done) {
  const q = 'skeen dj', el = $('qtext'); el.textContent = ''
  if (reduce) { el.textContent = q; done(); return }
  let i = 0; const tick = () => { el.textContent = q.slice(0, ++i); if (i < q.length) setTimeout(tick, 70); else setTimeout(done, 350) }
  setTimeout(tick, 300)
}

/* ═══════════ wiring ═══════════ */
function boot() {
  document.body.classList.toggle('is-analytics', S.page === 'analytics')
  $('page').classList.toggle('show-replay', S.page === 'search' && S.chart === 'replay')
  periods(); verdict(); tiles(true); requestAnimationFrame(markTiles); lower()
  if (S.page === 'analytics' || S.chart === 'climb') intro(); else { pause(); replaySet(); typeQuery(play) }
}
const pick = (attr, val) => document.querySelectorAll(`[data-${attr}]`).forEach((x) => x.classList.toggle('on', x.dataset[attr] === val))
document.querySelectorAll('[data-page]').forEach((b) => b.addEventListener('click', () => {
  S.page = b.dataset.page; pick('page', S.page)
  S.view = KEYS()[0]; S.prev = S.view
  S.period = S.page === 'analytics' ? '30d' : S.data === 'real' ? '28d' : '3m'
  boot()
}))
document.querySelectorAll('[data-chart]').forEach((b) => b.addEventListener('click', () => { S.chart = b.dataset.chart; pick('chart', S.chart); if (S.chart === 'replay') S.view = 'spot'; boot() }))
document.querySelectorAll('[data-data]').forEach((b) => b.addEventListener('click', () => { S.data = b.dataset.data; pick('data', S.data); S.period = S.data === 'real' ? '28d' : '3m'; boot() }))
const qs = new URLSearchParams(location.search)
if (qs.get('page') === 'analytics') { S.page = 'analytics'; pick('page', 'analytics'); S.view = 'views'; S.prev = 'views'; S.period = '30d' }
if (qs.get('data') === 'real') { S.data = 'real'; pick('data', 'real'); if (S.page === 'search') S.period = '28d' }
if (qs.get('view')) S.view = qs.get('view')
if (qs.get('chart') === 'replay') { S.chart = 'replay'; pick('chart', 'replay') }
document.fonts.ready.then(boot)
</script>
