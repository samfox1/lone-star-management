  body { margin:0; font-family:'Inter',system-ui,sans-serif; background:#09090b; color:#fafafa; }

  .tool-btn { font-family:inherit; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; padding:9px 15px; border-radius:7px; border:1px solid #3f3f46; background:transparent; color:#fafafa; cursor:pointer; }
  .tool-btn.primary { background:#fafafa; color:#09090b; border-color:#fafafa; }

  header.page-header { padding:36px 24px 18px; max-width:1280px; margin:0 auto; }
  header.page-header h1 { font-weight:600; font-size:clamp(24px,3vw,36px); letter-spacing:-0.02em; margin:0 0 8px; }
  header.page-header p { color:#a1a1aa; max-width:74ch; line-height:1.55; margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:24px; padding:24px; max-width:1500px; margin:0 auto; }
  .card { border:1px solid #27272a; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; background:#0c0c0e; }
  .card.selected { border-color:#22c55e; box-shadow:0 0 0 2px #22c55e; }
  .preview { aspect-ratio:4/3; background:#000; display:grid; place-items:center; cursor:pointer; overflow:hidden; position:relative; }
  .preview-scale { transform-origin:center; pointer-events:none; }
  .card-body { padding:16px; display:flex; flex-direction:column; gap:10px; }
  .card-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .card-num { font-size:10px; letter-spacing:0.28em; color:#71717a; text-transform:uppercase; }
  .card-name { font-weight:600; font-size:15px; }
  .card-tagline { font-size:13px; color:#a1a1aa; line-height:1.5; }
  .select-row { display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#a1a1aa; cursor:pointer; user-select:none; }
  .select-row input { accent-color:#22c55e; width:16px; height:16px; }
  textarea.comment { width:100%; min-height:64px; padding:10px; border:1px solid #27272a; border-radius:7px; background:#09090b; color:#fafafa; font-family:inherit; font-size:13px; resize:vertical; box-sizing:border-box; }
  .card-foot { display:flex; justify-content:space-between; font-size:10px; color:#71717a; letter-spacing:0.15em; text-transform:uppercase; }
  .saved-badge { opacity:0; transition:opacity 0.2s; color:#22c55e; }
  .saved-badge.show { opacity:1; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.92); display:grid; place-items:center; z-index:100; padding:24px; overflow:auto; }
  .modal-close { position:fixed; top:16px; right:20px; background:#09090b; border:1px solid #ef4444; color:#ef4444; font-size:30px; font-weight:300; cursor:pointer; line-height:1; z-index:110; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; }
  .modal-nav { position:fixed; top:50%; transform:translateY(-50%); width:54px; height:54px; display:grid; place-items:center; background:#09090b; border:1px solid #fafafa; color:#fafafa; border-radius:50%; font-size:26px; cursor:pointer; line-height:1; z-index:110; opacity:0.85; }
  .modal-nav:hover { opacity:1; }
  .modal-nav.prev { left:20px; } .modal-nav.next { right:20px; }
  .modal-counter { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:#a1a1aa; z-index:110; pointer-events:none; }
  .modal-frame { width:1200px; max-width:96vw; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.6); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#fafafa; color:#09090b; padding:10px 18px; border-radius:7px; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; opacity:0; pointer-events:none; transition:opacity 0.2s; }
  .toast.show { opacity:1; }

.v6-lam{position:relative;display:block;text-decoration:none;background:#f6f1e7;border-radius:14px;padding:0 0 22px;color:#1a1512;box-shadow:0 18px 34px rgba(0,0,0,.45);transform-origin:top center;transition:transform .22s ease,box-shadow .22s ease}
.v6-lam:nth-child(1){transform:rotate(-2.5deg)}
.v6-lam:nth-child(2){transform:rotate(1.8deg)}
.v6-lam:nth-child(3){transform:rotate(-1.4deg)}
.v6-lam:nth-child(4){transform:rotate(2.2deg)}
.v6-lam:hover,.v6-active{transform:rotate(0deg) translateY(-10px) !important;box-shadow:0 30px 50px rgba(0,0,0,.6)}
.v6-hole{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:46px;height:11px;background:#1a1512;border-radius:8px;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.v6-band{margin-top:30px;padding:9px 0;text-align:center;font-family:'Archivo',sans-serif;font-weight:800;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#fff}
.v6-lam:nth-child(1) .v6-band{background:#ff2e63}
.v6-lam:nth-child(2) .v6-band{background:#2ee6e6;color:#06343a}
.v6-lam:nth-child(3) .v6-band{background:#b14aed}
.v6-lam:nth-child(4) .v6-band{background:#f5d90a;color:#3a3300}
.v6-body{padding:24px 22px 6px;text-align:center}
.v6-role{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#9a8a73}
.v6-name{font-family:'Archivo',sans-serif;font-weight:800;font-size:21px;line-height:1.15;margin:10px 0 14px;color:#1a1512}
.v6-slugchip{display:inline-block;font-family:'Inter';font-size:12px;font-weight:600;letter-spacing:.04em;color:#5c4f3d;background:#ece3d3;border:1px dashed #c9bca3;border-radius:20px;padding:5px 14px}
.v6-barcode{height:26px;margin:20px 22px 0;background:repeating-linear-gradient(90deg,#1a1512 0 2px,transparent 2px 4px,#1a1512 4px 5px,transparent 5px 9px);opacity:.8}

<script>
const VARIANTS = [{"id": 1, "name": "Refined Pro", "tagline": "Linear-grade neutral admin: tight spacing, hairline borders, crisp type, quiet row affordances.", "html": "<div class=\"v1-page\">\n  <header class=\"v1-header\">\n    <div class=\"v1-brand\">\n      <div class=\"v1-mark\">L</div>\n      <span class=\"v1-wordmark\">Lone Star Management</span>\n    </div>\n    <div class=\"v1-headright\">\n      <span class=\"v1-email\">samuel.j.fox1@gmail.com</span>\n      <button class=\"v1-signout\">Sign out</button>\n    </div>\n  </header>\n  <main class=\"v1-main\">\n    <h1 class=\"v1-h1\">Your artists</h1>\n    <p class=\"v1-sub\">The artists you manage.</p>\n    <div class=\"v1-listhead\">\n      <span class=\"v1-listlabel\">Roster</span>\n      <span class=\"v1-count\">4</span>\n    </div>\n    <nav class=\"v1-list\">\n      <a class=\"v1-row\" href=\"/willie\">\n        <div class=\"v1-avatar\">WN</div>\n        <div class=\"v1-rowtext\"><span class=\"v1-name\">Willie Nelson</span><span class=\"v1-slug\">/willie</span></div>\n        <span class=\"v1-arrow\">&rsaquo;</span>\n      </a>\n      <a class=\"v1-row v1-row-active\" href=\"/miranda\">\n        <div class=\"v1-avatar\">ML</div>\n        <div class=\"v1-rowtext\"><span class=\"v1-name\">Miranda Lambert</span><span class=\"v1-slug\">/miranda</span></div>\n        <span class=\"v1-arrow\">&rsaquo;</span>\n      </a>\n      <a class=\"v1-row\" href=\"/george\">\n        <div class=\"v1-avatar\">GS</div>\n        <div class=\"v1-rowtext\"><span class=\"v1-name\">George Strait</span><span class=\"v1-slug\">/george</span></div>\n        <span class=\"v1-arrow\">&rsaquo;</span>\n      </a>\n      <a class=\"v1-row\" href=\"/kacey\">\n        <div class=\"v1-avatar\">KM</div>\n        <div class=\"v1-rowtext\"><span class=\"v1-name\">Kacey Musgraves</span><span class=\"v1-slug\">/kacey</span></div>\n        <span class=\"v1-arrow\">&rsaquo;</span>\n      </a>\n    </nav>\n  </main>\n</div>", "miniScale": 0.32}, {"id": 2, "name": "Lone Star Brand", "tagline": "Warm Texas identity: burnt-orange accent, a sparing star motif, paper background, ownable wordmark.", "html": "<div class=\"v2-page\">\n  <header class=\"v2-header\">\n    <div class=\"v2-brand\">\n      <div class=\"v2-star\">&#9733;</div>\n      <span class=\"v2-wordmark\">Lone Star <span>Management</span></span>\n    </div>\n    <div class=\"v2-headright\">\n      <span class=\"v2-email\">samuel.j.fox1@gmail.com</span>\n      <button class=\"v2-signout\">Sign out</button>\n    </div>\n  </header>\n  <main class=\"v2-main\">\n    <div class=\"v2-kicker\"><span class=\"v2-dot\"></span> Manager Dashboard</div>\n    <h1 class=\"v2-h1\">Your <em>artists</em></h1>\n    <p class=\"v2-sub\">The artists you manage.</p>\n    <nav class=\"v2-list\">\n      <a class=\"v2-row\" href=\"/willie\">\n        <div class=\"v2-badge\">WN</div>\n        <div class=\"v2-rowtext\"><span class=\"v2-name\">Willie Nelson</span><span class=\"v2-slug\">/willie</span></div>\n        <span class=\"v2-go\">Open &#9733;</span>\n      </a>\n      <a class=\"v2-row\" href=\"/miranda\">\n        <div class=\"v2-badge\">ML</div>\n        <div class=\"v2-rowtext\"><span class=\"v2-name\">Miranda Lambert</span><span class=\"v2-slug\">/miranda</span></div>\n        <span class=\"v2-go\">Open &#9733;</span>\n      </a>\n      <a class=\"v2-row\" href=\"/george\">\n        <div class=\"v2-badge\">GS</div>\n        <div class=\"v2-rowtext\"><span class=\"v2-name\">George Strait</span><span class=\"v2-slug\">/george</span></div>\n        <span class=\"v2-go\">Open &#9733;</span>\n      </a>\n      <a class=\"v2-row\" href=\"/kacey\">\n        <div class=\"v2-badge\">KM</div>\n        <div class=\"v2-rowtext\"><span class=\"v2-name\">Kacey Musgraves</span><span class=\"v2-slug\">/kacey</span></div>\n        <span class=\"v2-go\">Open &#9733;</span>\n      </a>\n    </nav>\n  </main>\n</div>", "miniScale": 0.32}, {"id": 3, "name": "Editorial Minimal", "tagline": "Magazine calm: vast whitespace, big restrained Archivo display type, hairline rules, almost no chrome.", "html": "<div class=\"v3-page\">\n  <header class=\"v3-header\">\n    <span class=\"v3-wordmark\">Lone Star Management</span>\n    <div class=\"v3-headright\">\n      <span class=\"v3-email\">samuel.j.fox1@gmail.com</span>\n      <button class=\"v3-signout\">Sign out</button>\n    </div>\n  </header>\n  <main class=\"v3-main\">\n    <p class=\"v3-eyebrow\">Roster &mdash; 04</p>\n    <h1 class=\"v3-h1\">Your artists</h1>\n    <p class=\"v3-sub\">The artists you manage.</p>\n    <nav class=\"v3-list\">\n      <a class=\"v3-row\" href=\"/willie\">\n        <span class=\"v3-num\">01</span>\n        <span class=\"v3-name\">Willie Nelson</span>\n        <span class=\"v3-slug\">/willie</span>\n      </a>\n      <a class=\"v3-row v3-row-active\" href=\"/miranda\">\n        <span class=\"v3-num\">02</span>\n        <span class=\"v3-name\">Miranda Lambert</span>\n        <span class=\"v3-slug\">/miranda</span>\n      </a>\n      <a class=\"v3-row\" href=\"/george\">\n        <span class=\"v3-num\">03</span>\n        <span class=\"v3-name\">George Strait</span>\n        <span class=\"v3-slug\">/george</span>\n      </a>\n      <a class=\"v3-row\" href=\"/kacey\">\n        <span class=\"v3-num\">04</span>\n        <span class=\"v3-name\">Kacey Musgraves</span>\n        <span class=\"v3-slug\">/kacey</span>\n      </a>\n    </nav>\n  </main>\n</div>", "miniScale": 0.32}, {"id": 4, "name": "Neon Marquee", "tagline": "Cinematic blackout stage with a glitch-lit Archivo wordmark and magenta-on-cyan neon rails.", "html": "<div class=\"v4-page\">\n  <header class=\"v4-header\">\n    <div class=\"v4-brand\">\n      <div class=\"v4-wordmark\">Lone Star Management</div>\n      <span class=\"v4-tag\">Artist Operating System</span>\n    </div>\n    <div class=\"v4-userbox\">\n      <span class=\"v4-email\">samuel.j.fox1@gmail.com</span>\n      <button class=\"v4-signout\">Sign out</button>\n    </div>\n  </header>\n  <main class=\"v4-main\">\n    <h1 class=\"v4-h1\">Your artists</h1>\n    <p class=\"v4-sub\">The artists you manage.</p>\n    <div class=\"v4-list\">\n      <a class=\"v4-row v4-active\" href=\"/willie\">\n        <div><div class=\"v4-name\">Willie Nelson</div><div class=\"v4-slug\">/willie</div></div>\n        <span class=\"v4-arrow\">&rarr;</span>\n      </a>\n      <a class=\"v4-row\" href=\"/miranda\">\n        <div><div class=\"v4-name\">Miranda Lambert</div><div class=\"v4-slug\">/miranda</div></div>\n        <span class=\"v4-arrow\">&rarr;</span>\n      </a>\n      <a class=\"v4-row\" href=\"/george\">\n        <div><div class=\"v4-name\">George Strait</div><div class=\"v4-slug\">/george</div></div>\n        <span class=\"v4-arrow\">&rarr;</span>\n      </a>\n      <a class=\"v4-row\" href=\"/kacey\">\n        <div><div class=\"v4-name\">Kacey Musgraves</div><div class=\"v4-slug\">/kacey</div></div>\n        <span class=\"v4-arrow\">&rarr;</span>\n      </a>\n    </div>\n  </main>\n</div>", "miniScale": 0.32}, {"id": 5, "name": "Operator", "tagline": "Restrained Linear-grade charcoal: dense, precise, near-monochrome with one quiet amber tick.", "html": "<div class=\"v5-page\">\n  <header class=\"v5-header\">\n    <div class=\"v5-brand\">\n      <span class=\"v5-dot\"></span>\n      <span class=\"v5-wordmark\">Lone Star Management</span>\n    </div>\n    <div class=\"v5-userbox\">\n      <span class=\"v5-email\">samuel.j.fox1@gmail.com</span>\n      <button class=\"v5-signout\">Sign out</button>\n    </div>\n  </header>\n  <main class=\"v5-main\">\n    <div class=\"v5-eyebrow\">Roster</div>\n    <h1 class=\"v5-h1\">Your artists</h1>\n    <p class=\"v5-sub\">The artists you manage.</p>\n    <div class=\"v5-meta\"><span class=\"v5-count\">4 artists</span></div>\n    <div class=\"v5-list\">\n      <a class=\"v5-row v5-active\" href=\"/willie\">\n        <div class=\"v5-left\"><div class=\"v5-mono\">WN</div><div><div class=\"v5-name\">Willie Nelson</div></div></div>\n        <div class=\"v5-right\"><span class=\"v5-slug\">/willie</span><span class=\"v5-go\">Open</span><span class=\"v5-chev\">&rsaquo;</span></div>\n      </a>\n      <a class=\"v5-row\" href=\"/miranda\">\n        <div class=\"v5-left\"><div class=\"v5-mono\">ML</div><div><div class=\"v5-name\">Miranda Lambert</div></div></div>\n        <div class=\"v5-right\"><span class=\"v5-slug\">/miranda</span><span class=\"v5-go\">Open</span><span class=\"v5-chev\">&rsaquo;</span></div>\n      </a>\n      <a class=\"v5-row\" href=\"/george\">\n        <div class=\"v5-left\"><div class=\"v5-mono\">GS</div><div><div class=\"v5-name\">George Strait</div></div></div>\n        <div class=\"v5-right\"><span class=\"v5-slug\">/george</span><span class=\"v5-go\">Open</span><span class=\"v5-chev\">&rsaquo;</span></div>\n      </a>\n      <a class=\"v5-row\" href=\"/kacey\">\n        <div class=\"v5-left\"><div class=\"v5-mono\">KM</div><div><div class=\"v5-name\">Kacey Musgraves</div></div></div>\n        <div class=\"v5-right\"><span class=\"v5-slug\">/kacey</span><span class=\"v5-go\">Open</span><span class=\"v5-chev\">&rsaquo;</span></div>\n      </a>\n    </div>\n  </main>\n</div>", "miniScale": 0.32}, {"id": 6, "name": "All Access", "tagline": "The roster as backstage laminates on a lanyard wall: punched holes, color bands, tactile tilt that straightens on hover.", "html": "<div class=\"v6-page\">\n  <header class=\"v6-header\">\n    <div class=\"v6-wordmark\">Lone Star <span>Management</span></div>\n    <div class=\"v6-userbox\">\n      <span class=\"v6-email\">samuel.j.fox1@gmail.com</span>\n      <button class=\"v6-signout\">Sign out</button>\n    </div>\n  </header>\n  <main class=\"v6-main\">\n    <h1 class=\"v6-h1\">Your artists</h1>\n    <p class=\"v6-sub\">The artists you manage.</p>\n    <div class=\"v6-grid\">\n      <a class=\"v6-lam v6-active\" href=\"/willie\">\n        <span class=\"v6-hole\"></span>\n        <div class=\"v6-band\">All Access</div>\n        <div class=\"v6-body\">\n          <div class=\"v6-role\">Artist</div>\n          <div class=\"v6-name\">Willie Nelson</div>\n          <span class=\"v6-slugchip\">/willie</span>\n        </div>\n        <div class=\"v6-barcode\"></div>\n        <div class=\"v6-foot\">Lone Star &middot; Crew Pass</div>\n      </a>\n      <a class=\"v6-lam\" href=\"/miranda\">\n        <span class=\"v6-hole\"></span>\n        <div class=\"v6-band\">All Access</div>\n        <div class=\"v6-body\">\n          <div class=\"v6-role\">Artist</div>\n          <div class=\"v6-name\">Miranda Lambert</div>\n          <span class=\"v6-slugchip\">/miranda</span>\n        </div>\n        <div class=\"v6-barcode\"></div>\n        <div class=\"v6-foot\">Lone Star &middot; Crew Pass</div>\n      </a>\n      <a class=\"v6-lam\" href=\"/george\">\n        <span class=\"v6-hole\"></span>\n        <div class=\"v6-band\">All Access</div>\n        <div class=\"v6-body\">\n          <div class=\"v6-role\">Artist</div>\n          <div class=\"v6-name\">George Strait</div>\n          <span class=\"v6-slugchip\">/george</span>\n        </div>\n        <div class=\"v6-barcode\"></div>\n        <div class=\"v6-foot\">Lone Star &middot; Crew Pass</div>\n      </a>\n      <a class=\"v6-lam\" href=\"/kacey\">\n        <span class=\"v6-hole\"></span>\n        <div class=\"v6-band\">All Access</div>\n        <div class=\"v6-body\">\n          <div class=\"v6-role\">Artist</div>\n          <div class=\"v6-name\">Kacey Musgraves</div>\n          <span class=\"v6-slugchip\">/kacey</span>\n        </div>\n        <div class=\"v6-barcode\"></div>\n        <div class=\"v6-foot\">Lone Star &middot; Crew Pass</div>\n      </a>\n    </div>\n  </main>\n</div>", "miniScale": 0.32}];
const STORE_KEY = 'dvh_lone_star_home_20260629_1200';
function loadState(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); } catch { return {}; } }
function saveState(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); updateCount(); }
function updateCount(){
  const s=loadState();
  const sel=Object.values(s).filter(v=>v&&v.selected).length;
  const com=Object.values(s).filter(v=>v&&v.comment&&v.comment.trim()).length;
  document.getElementById('countLabel').textContent = sel+' selected · '+com+' commented';
}
const state=loadState();
const grid=document.getElementById('grid');
VARIANTS.forEach(v=>{
  const saved=state[v.id]||{};
  const card=document.createElement('article');
  card.className='card'+(saved.selected?' selected':'');
  card.innerHTML =
    '<div class="preview" data-open="'+v.id+'"><div class="preview-scale" style="transform:scale('+(v.miniScale||0.55)+');">'+v.html+'</div></div>'+
    '<div class="card-body"><div class="card-head"><div><div class="card-num">V'+String(v.id).padStart(2,'0')+'</div><div class="card-name">'+v.name+'</div></div>'+
    '<label class="select-row"><input type="checkbox" data-select="'+v.id+'" '+(saved.selected?'checked':'')+' /> Pick</label></div>'+
    '<div class="card-tagline">'+v.tagline+'</div>'+
    '<textarea class="comment" data-id="'+v.id+'" placeholder="Feedback on '+v.name+'…">'+((saved.comment||'').replace(/</g,'&lt;'))+'</textarea>'+
    '<div class="card-foot"><span class="saved-badge" data-badge="'+v.id+'">Saved ✓</span></div></div>';
  grid.appendChild(card);
});
updateCount();
const timers={};
grid.addEventListener('input',e=>{
  const ta=e.target.closest('textarea[data-id]'); if(!ta) return;
  const id=ta.dataset.id; clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{ const s=loadState(); s[id]={...(s[id]||{}),comment:ta.value}; saveState(s);
    const b=document.querySelector('[data-badge="'+id+'"]'); b.classList.add('show'); setTimeout(()=>b.classList.remove('show'),1200);},400);
});
grid.addEventListener('change',e=>{
  const cb=e.target.closest('input[data-select]'); if(!cb) return;
  const id=cb.dataset.select; const s=loadState(); s[id]={...(s[id]||{}),selected:cb.checked}; saveState(s);
  cb.closest('.card').classList.toggle('selected',cb.checked);
});
const modalRoot=document.getElementById('modalRoot');
let currentModalId=null;
function openVariant(id){
  const idx=VARIANTS.findIndex(x=>String(x.id)===String(id)); if(idx===-1) return;
  const v=VARIANTS[idx];
  const prev=VARIANTS[(idx-1+VARIANTS.length)%VARIANTS.length];
  const next=VARIANTS[(idx+1)%VARIANTS.length];
  currentModalId=v.id;
  modalRoot.innerHTML =
    '<div class="modal-overlay">'+
    '<button class="modal-close" aria-label="Close">&times;</button>'+
    '<button class="modal-nav prev" data-nav="'+prev.id+'">&#8249;</button>'+
    '<button class="modal-nav next" data-nav="'+next.id+'">&#8250;</button>'+
    '<div class="modal-counter">V'+String(v.id).padStart(2,'0')+' · '+(idx+1)+' of '+VARIANTS.length+' — '+v.name+'</div>'+
    '<div class="modal-frame" onclick="event.stopPropagation()">'+v.html+'</div></div>';
}
function closeModal(){ modalRoot.innerHTML=''; currentModalId=null; }
function navModal(dir){ if(currentModalId==null) return;
  const idx=VARIANTS.findIndex(x=>String(x.id)===String(currentModalId)); if(idx===-1) return;
  openVariant(VARIANTS[(idx+dir+VARIANTS.length)%VARIANTS.length].id);
}
grid.addEventListener('click',e=>{ const o=e.target.closest('[data-open]'); if(o) openVariant(o.dataset.open); });
modalRoot.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]'); if(nav){ e.stopPropagation(); openVariant(nav.dataset.nav); return; }
  if(e.target.closest('.modal-close')){ closeModal(); return; }
  if(e.target.classList && e.target.classList.contains('modal-overlay')) closeModal();
});
document.addEventListener('keydown',e=>{
  if(currentModalId==null) return;
  if(e.key==='Escape') closeModal(); else if(e.key==='ArrowLeft') navModal(-1); else if(e.key==='ArrowRight') navModal(1);
});
document.getElementById('exportBtn').addEventListener('click',async()=>{
  const s=loadState();
  const payload={ target:'Lone Star Management — Look & Feel', variants:VARIANTS.map(v=>({id:v.id,name:v.name,tagline:v.tagline,selected:!!(s[v.id]&&s[v.id].selected),comment:(s[v.id]&&s[v.id].comment)||null})) };
  const json=JSON.stringify(payload,null,2);
  try{ await navigator.clipboard.writeText(json); showToast('Copied — paste to Claude'); }catch{ prompt('Copy manually:',json); }
});
document.getElementById('clearBtn').addEventListener('click',()=>{ if(!confirm('Clear all comments and selections?')) return; localStorage.removeItem(STORE_KEY); location.reload(); });
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
</script>
</body>
</html>
