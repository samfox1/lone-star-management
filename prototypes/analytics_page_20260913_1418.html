<style>
  /* The app loads these through next/font, which mints a hashed family name that does
     not exist outside the app. Map the same variables to the real faces so every
     utility the compiled CSS defines (font-space, font-body, font-display) resolves to
     the face the site actually renders. */
  :root{
    --font-body:'Instrument Sans',system-ui,sans-serif;
    --font-space-mono:'Space Mono',ui-monospace,monospace;
    --font-display:'Archivo','Instrument Sans',sans-serif;
    --font-geist-sans:'Instrument Sans',system-ui,sans-serif;
    --font-geist-mono:'Space Mono',ui-monospace,monospace;
  }
</style>

<style>
  /* Preview-only shim.

     Tailwind v4 inlines each utility's literal colour and emits a brand CSS
     variable ONLY where the app source happens to reference one. So the compiled
     sheet defines .bg-accent (#2563eb) but NOT --color-accent, and it defines
     .stroke-hairline but no .stroke-accent and no fill-* at all — because the
     dashboard never used them. Variants that reached for those got stroke:none
     (an invisible line) and fill's initial value (a BLACK area). Round 1 shipped
     that way.

     Every value below is copied verbatim out of _lone-star-compiled.css, so this
     adds no new colour — it only gives the missing names the values the real
     utilities already carry. If a promoted variant keeps using stroke-accent or
     fill-accent, those utilities have to be added to the app's theme too. */
  :root{
    --color-paper:#fff;
    --color-ink:#111;
    --color-ink-muted:#4b5563;
    --color-ink-faint:#9aa0a6;
    --color-accent:#2563eb;
    --color-accent-soft:#eef4ff;
    --color-accent-red:#e5484d;
    --color-hairline:#ececec;
    --color-hairline-soft:#f4f4f5;
    --color-track:#f4f4f5;
  }
  .stroke-accent{stroke:#2563eb}
  .stroke-accent-red{stroke:#e5484d}
  .stroke-accent-soft{stroke:#eef4ff}
  .stroke-paper{stroke:#fff}
  .fill-accent{fill:#2563eb}
  .fill-accent-soft{fill:#eef4ff}
  .fill-accent-red{fill:#e5484d}
  .fill-track{fill:#f4f4f5}
  .fill-ink{fill:#111}
  .fill-ink-muted{fill:#4b5563}
  .fill-ink-faint{fill:#9aa0a6}
  .fill-paper{fill:#fff}
  .fill-hairline{fill:#ececec}
</style>

  body { margin:0; font-family:var(--font-body); background:#e9e9ec; color:#111; -webkit-font-smoothing:antialiased; }

  .saved-badge.show { opacity:1; }
  /* --- Modal --- */
  .modal-overlay { position:fixed; inset:0; background:rgba(20,20,24,.55); display:grid; place-items:start center; z-index:100; padding:64px 24px; overflow:auto; }
  .modal-stage { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 30px 90px rgba(0,0,0,.35); }
  .modal-close { position:fixed; top:14px; right:18px; background:#fff; border:1px solid #ececec; color:#111; font-size:26px; font-weight:300; cursor:pointer; line-height:1; z-index:110; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-body); }

an></div></div><div><div class='v18-sechead'><span class='font-space text-[10px] font-bold uppercase tracking-[0.12em] text-ink-faint'>Top content</span><span class='font-space text-[10px] uppercase tracking-[0.1em] text-ink-faint'>Views</span></div><div class='v18-row'><div class='v18-rowT'><span class='v18-name text-sm text-ink'>Summer Sun</span><span class='font-space text-[11px] font-bold tabular-nums text-ink'>268</span></div><span class='v18-bar bg-accent' style='width:100%'></span></div><div class='v18-row'><div class='v18-rowT'><span class='v18-name text-sm text-ink'>REDLINE Warehouse</span><span class='font-space text-[11px] font-bold tabular-nums text-ink'>184</span></div><span class='v18-bar bg-accent' style='width:68.7%'></span></div><div class='v18-row'><div class='v18-rowT'><span class='v18-name text-sm text-ink'>Home Again</span><span class='font-space text-[11px] font-bold tabular-nums text-ink'>141</span></div><span class='v18-bar bg-accent' style='width:52.6%'></span></div><div class='v18-row'><div class='v18-rowT'><span class='v18-name text-sm text-ink'>DAY 285: First Festival</span><span class='font-space text-[11px] font-bold tabular-nums text-ink'>112</span></div><span class='v18-bar bg-accent' style='width:41.8%'></span></div><div class='v18-row'><div class='v18-rowT'><span class='v18-name text-sm text-ink'>Couldn\u2019t Sleep</span><span class='font-space text-[11px] font-bold tabular-nums text-ink'>96</span></div><span class='v18-bar bg-accent' style='width:35.8%'></span></div><div class='v18-row'><div class='v18-rowT'><span class='v18-name text-sm text-ink'>Lakeshore Music Festival</span><span class='font-space text-[11px] font-bold tabular-nums text-ink'>74</span></div><span class='v18-bar bg-accent' style='width:27.6%'></span></div></div></div></div></div></div>", "miniScale": 0.32}];
const STORE_KEY = 'dvh_analytics_page_20260913_1418';

function loadState(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; } }
function saveState(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); updateCount(); }
function updateCount(){
  const s = loadState();
  const selected = Object.values(s).filter(v => v && v.selected).length;
  const commented = Object.values(s).filter(v => v && v.comment && v.comment.trim()).length;
  document.getElementById('countLabel').textContent = selected + ' selected · ' + commented + ' commented';
}

const state = loadState();
const grid = document.getElementById('grid');
VARIANTS.forEach(v => {
  const saved = state[v.id] || {};
  const card = document.createElement('article');
  card.className = 'card' + (saved.selected ? ' selected' : '');
  const head = document.createElement('div');
  card.innerHTML =
    '<div class="preview" data-open="' + v.id + '">' +
      '<div class="preview-scale" style="transform: scale(' + (v.miniScale || 0.32) + ');"></div>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-head"><div><div class="card-num">V' + String(v.id).padStart(2,'0') + '</div>' +
      '<div class="card-name"></div></div>' +
      '<label class="select-row"><input type="checkbox" data-select="' + v.id + '"' + (saved.selected ? ' checked' : '') + ' /> Pick</label></div>' +
      '<div class="card-tagline"></div>' +
      '<textarea class="comment" data-id="' + v.id + '" placeholder="Feedback…"></textarea>' +
      '<div class="card-foot"><span class="saved-badge" data-badge="' + v.id + '">Saved</span></div>' +
    '</div>';
  card.querySelector('.card-name').textContent = v.name;
  card.querySelector('.card-tagline').textContent = v.tagline;
  card.querySelector('textarea').value = saved.comment || '';
  card.querySelector('.preview-scale').innerHTML = v.html;
  grid.appendChild(card);
});
updateCount();

const timers = {};
grid.addEventListener('input', e => {
  const ta = e.target.closest('textarea[data-id]');
  if (!ta) return;
  const id = ta.dataset.id;
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => {
    const s = loadState();
    s[id] = Object.assign({}, s[id] || {}, { comment: ta.value });
    saveState(s);
    const badge = document.querySelector('[data-badge="' + id + '"]');
    if (badge) { badge.classList.add('show'); setTimeout(() => badge.classList.remove('show'), 1100); }
  }, 400);
});
grid.addEventListener('change', e => {
  const cb = e.target.closest('input[data-select]');
  if (!cb) return;
  const s = loadState();
  s[cb.dataset.select] = Object.assign({}, s[cb.dataset.select] || {}, { selected: cb.checked });
  saveState(s);
  cb.closest('.card').classList.toggle('selected', cb.checked);
});

const modalRoot = document.getElementById('modalRoot');
let currentModalId = null;
function openVariant(id){
  const idx = VARIANTS.findIndex(x => String(x.id) === String(id));
  if (idx === -1) return;
  const v = VARIANTS[idx];
  const prev = VARIANTS[(idx - 1 + VARIANTS.length) % VARIANTS.length];
  const next = VARIANTS[(idx + 1) % VARIANTS.length];
  currentModalId = v.id;
  modalRoot.innerHTML =
    '<div class="modal-overlay">' +
      '<button class="modal-close" aria-label="Close">&times;</button>' +
      '<button class="modal-nav prev" data-nav="' + prev.id + '" aria-label="Previous">&#8249;</button>' +
      '<button class="modal-nav next" data-nav="' + next.id + '" aria-label="Next">&#8250;</button>' +
      '<div class="modal-counter">V' + String(v.id).padStart(2,'0') + ' · ' + (idx+1) + ' of ' + VARIANTS.length + ' — ' + v.name + '</div>' +
      '<div class="modal-stage"></div>' +
    '</div>';
  modalRoot.querySelector('.modal-stage').innerHTML = v.html;
}
function closeModal(){ modalRoot.innerHTML = ''; currentModalId = null; }
function navModal(dir){
  if (currentModalId == null) return;
  const idx = VARIANTS.findIndex(x => String(x.id) === String(currentModalId));
  if (idx === -1) return;
  openVariant(VARIANTS[(idx + dir + VARIANTS.length) % VARIANTS.length].id);
}
grid.addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open) openVariant(open.dataset.open);
});
modalRoot.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.stopPropagation(); openVariant(nav.dataset.nav); return; }
  if (e.target.closest('.modal-close')) { closeModal(); return; }
  if (e.target.classList && e.target.classList.contains('modal-overlay')) closeModal();
});
document.addEventListener('keydown', e => {
  if (currentModalId == null) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowLeft') navModal(-1);
  else if (e.key === 'ArrowRight') navModal(1);
});

document.getElementById('exportBtn').addEventListener('click', async () => {
  const s = loadState();
  const payload = {
    exportedAt: new Date().toISOString(),
    target: 'Lone Star — Analytics page',
    variants: VARIANTS.map(v => ({
      id: v.id, name: v.name, tagline: v.tagline,
      selected: !!(s[v.id] && s[v.id].selected),
      comment: (s[v.id] && s[v.id].comment) || null,
    })),
  };
  const json = JSON.stringify(payload, null, 2);
  try { await navigator.clipboard.writeText(json); showToast('Copied — paste to Claude'); }
  catch { window.prompt('Copy manually:', json); }
});
document.getElementById('clearBtn').addEventListener('click', () => {
  if (!window.confirm('Clear all comments and selections?')) return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
});
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1700);
}
</script>
