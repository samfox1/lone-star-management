<style>
:root{--paper:#fff;--surface:#fafafa;--hover:#f6f7f8;--ink:#111;--muted:#6b7280;--faint:#9aa0a6;--hair:#ececec;--hair-soft:#f1f1f3;--accent:#2563eb;--accent-soft:#eef4ff;--sw:1.6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--paper:#111;--surface:#171717;--hover:#1e1e1e;--ink:#f2f2f2;--muted:#a3a7ad;--faint:#6f7378;--hair:#2a2a2a;--hair-soft:#222;--accent:#7aa2ff;--accent-soft:#1a2440}}
:root[data-theme=dark]{color-scheme:dark;--paper:#111;--surface:#171717;--hover:#1e1e1e;--ink:#f2f2f2;--muted:#a3a7ad;--faint:#6f7378;--hair:#2a2a2a;--hair-soft:#222;--accent:#7aa2ff;--accent-soft:#1a2440}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Instrument Sans",system-ui,sans-serif}
.app{display:flex;min-height:100%}
/* the live mock: the Fonts ledger, sticky on the left, wearing whatever you click */
.mock{position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:100vh;box-sizing:border-box;flex:none;width:380px;border-right:1px solid var(--hair);padding:28px 24px;display:flex;flex-direction:column;gap:6px}
.mock .hd{font-family:"Space Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.row{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--hair-soft)}
.row .l{font-size:15px;font-weight:500}
.row .fp{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .fp.mono{font-family:"Space Mono",ui-monospace,monospace}
.act{display:flex;gap:4px}
.ic{all:unset;cursor:pointer;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--muted);opacity:.45}
.row:hover .ic{opacity:1}.ic:hover{background:var(--hover);color:var(--ink)}
.ic svg,.ic .g,.ic .g svg{width:20px;height:20px;display:block}
.mock .now{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.mock .now span{font-family:"Space Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.mock .now b{font-weight:600}
.mock .big{display:flex;gap:14px;align-items:center;margin-top:8px;color:var(--ink)}
.mock .big .g{width:40px;height:40px;display:block}.mock .big .g svg{width:40px;height:40px;display:block}
.mock .ctl{margin-top:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mock .ctl label{font-family:"Space Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
input[type=range]{width:120px;accent-color:var(--ink)}
.b{all:unset;cursor:pointer;font-size:13px;font-weight:500;padding:7px 12px;border-radius:8px;border:1px solid var(--hair);color:var(--ink)}
.b:hover{background:var(--hover)}
.b:focus-visible,.c:focus-visible,.ic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-width:0;padding-block:28px 64px;padding-inline:28px;max-width:980px}
h1{font-size:18px;font-weight:600;margin:0 0 4px;text-wrap:balance}
.sub{margin:0 0 20px;color:var(--muted)}
.set{border-top:1px solid var(--hair);padding-block:16px}
.set h2{font-family:"Space Mono",ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.c{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;padding:12px 2px 8px;border:1px solid transparent;border-radius:10px;color:var(--muted);box-sizing:border-box}
.c:hover{background:var(--hover);color:var(--ink)}
.c.sel{border-color:var(--ink);color:var(--ink)}
.c .g{width:22px;height:22px;display:block}.c .g svg{width:22px;height:22px;display:block}
.c .n{font-family:"Space Mono",ui-monospace,monospace;font-size:9px;line-height:11px;color:var(--faint);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g[data-stroke] svg *{stroke-width:var(--sw)}
@media (max-width:760px){.app{flex-direction:column}.mock{position:static;height:auto;width:auto;border-right:0;border-bottom:1px solid var(--hair)}main{padding-inline:16px}}
@media (prefers-reduced-motion:no-preference){.c,.ic{transition:background .12s,opacity .12s}}
</style>

<script>
(() => {
  const KEY = 'font-change-icon-v1'
  const cells = document.querySelectorAll('.c'), pick = document.getElementById('pick'), big = document.getElementById('big')
  function choose(c) {
    cells.forEach((x) => x.classList.toggle('sel', x === c))
    const g = c.querySelector('.g')
    document.querySelectorAll('.chg .g').forEach((t) => { t.innerHTML = g.innerHTML; t.toggleAttribute('data-stroke', g.hasAttribute('data-stroke')) })
    big.innerHTML = g.innerHTML; big.toggleAttribute('data-stroke', g.hasAttribute('data-stroke'))
    pick.textContent = c.title
    try { localStorage.setItem(KEY, c.dataset.set + '/' + c.dataset.name) } catch {}
  }
  cells.forEach((c) => c.addEventListener('click', () => choose(c)))
  let saved = null; try { saved = localStorage.getItem(KEY) } catch {}
  const start = saved && document.querySelector('.c[data-set="' + saved.split('/')[0] + '"][data-name="' + saved.split('/')[1] + '"]')
  choose(start || document.querySelector('.c[data-set="lucide"][data-name="chevrons-up-down"]') || cells[0])
  document.getElementById('sw').addEventListener('input', (e) => { document.documentElement.style.setProperty('--sw', e.target.value); document.getElementById('swv').textContent = e.target.value })
  document.getElementById('copy').addEventListener('click', async (e) => {
    try { await navigator.clipboard.writeText(pick.textContent); e.target.textContent = 'Copied' } catch { const r = document.createRange(); r.selectNodeContents(pick); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = 'Selected' }
    setTimeout(() => (e.target.textContent = 'Copy pick'), 1500)
  })
})()
</script>
