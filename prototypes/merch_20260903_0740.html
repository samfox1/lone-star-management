div class=\"v8-sth\"><div class=\"v8-sthin v8-a\"></div></div> <div class=\"v8-sbody\"> <div class=\"v8-srow\"><span>cropped logo tee</span><span>$45</span></div> <div class=\"v8-svar\">size m</div> <div class=\"v8-sbot\"> <span class=\"v8-qty\"><button>&minus;</button><span class=\"v8-qn\">1</span><button>+</button></span> <button class=\"v8-del\">&times;</button> </div> </div> </div> <div class=\"v8-sli\"> <div class=\"v8-sth\"><div class=\"v8-sthin v8-d\"></div></div> <div class=\"v8-sbody\"> <div class=\"v8-srow\"><span>field notes cap</span><span>$76</span></div> <div class=\"v8-svar\">one size</div> <div class=\"v8-sbot\"> <span class=\"v8-qty\"><button>&minus;</button><span class=\"v8-qn\">2</span><button>+</button></span> <button class=\"v8-del\">&times;</button> </div> </div> </div> <div class=\"v8-sums\"> <div class=\"v8-sum\"><span>subtotal</span><span>$121</span></div> <div class=\"v8-sum\"><span>shipping</span><span>calculated at checkout</span></div> </div> <div class=\"v8-total\"><span>total</span><span>$121</span></div> <button class=\"v8-co\">checkout</button> <button class=\"v8-keep\">keep looking</button> </div> <div class=\"v8-tear\"></div> </div> </section> </div>", "miniScale": 0.32}];
const STORE_KEY = 'dvh_merch_20260903_0740';

function loadState() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; } }
function saveState(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); updateCount(); }
function updateCount() {
  const s = loadState();
  const selected = Object.values(s).filter(v => v && v.selected).length;
  const commented = Object.values(s).filter(v => v && v.comment && v.comment.trim()).length;
  document.getElementById('countLabel').textContent = selected + ' selected · ' + commented + ' commented';
}

const state = loadState();
const grid = document.getElementById('grid');
VARIANTS.forEach(v => {
  const saved = state[v.id] || {};
  const card = document.createElement('article');
  card.className = 'card' + (saved.selected ? ' selected' : '');
  card.innerHTML = '<div class="preview" data-open="' + v.id + '">' +
      '<div class="preview-scale" style="transform: scale(' + (v.miniScale || 0.3) + ');">' + v.html + '</div>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-head">' +
        '<div><div class="card-num">V' + String(v.id).padStart(2,'0') + '</div><div class="card-name">' + v.name + '</div></div>' +
        '<label class="select-row"><input type="checkbox" data-select="' + v.id + '" ' + (saved.selected ? 'checked' : '') + ' /> pick</label>' +
      '</div>' +
      '<div class="card-tagline">' + v.tagline + '</div>' +
      '<textarea class="comment" data-id="' + v.id + '" placeholder="feedback on ' + v.name + '…">' + (saved.comment || '').replace(/</g,'&lt;') + '</textarea>' +
      '<div class="card-foot"><span class="saved-badge" data-badge="' + v.id + '">saved ✓</span></div>' +
    '</div>';
  grid.appendChild(card);
});
updateCount();

const timers = {};
grid.addEventListener('input', e => {
  const ta = e.target.closest('textarea[data-id]');
  if (!ta) return;
  const id = ta.dataset.id;
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => {
    const s = loadState();
    s[id] = Object.assign({}, s[id] || {}, { comment: ta.value });
    saveState(s);
    const badge = document.querySelector('[data-badge="' + id + '"]');
    badge.classList.add('show');
    setTimeout(() => badge.classList.remove('show'), 1200);
  }, 400);
});
grid.addEventListener('change', e => {
  const cb = e.target.closest('input[data-select]');
  if (!cb) return;
  const id = cb.dataset.select;
  const s = loadState();
  s[id] = Object.assign({}, s[id] || {}, { selected: cb.checked });
  saveState(s);
  cb.closest('.card').classList.toggle('selected', cb.checked);
});

const modalRoot = document.getElementById('modalRoot');
let currentModalId = null;
function openVariant(id) {
  const idx = VARIANTS.findIndex(x => String(x.id) === String(id));
  if (idx === -1) return;
  const v = VARIANTS[idx];
  const prev = VARIANTS[(idx - 1 + VARIANTS.length) % VARIANTS.length];
  const next = VARIANTS[(idx + 1) % VARIANTS.length];
  currentModalId = v.id;
  modalRoot.innerHTML = '<div class="modal-overlay">' +
      '<button class="modal-close" aria-label="Close">&times;</button>' +
      '<button class="modal-nav prev" data-nav="' + prev.id + '">&#8249;</button>' +
      '<button class="modal-nav next" data-nav="' + next.id + '">&#8250;</button>' +
      '<div class="modal-counter">V' + String(v.id).padStart(2,'0') + ' · ' + (idx+1) + ' of ' + VARIANTS.length + ' — ' + v.name + '</div>' +
      '<div onclick="event.stopPropagation()">' + v.html + '</div>' +
    '</div>';
}
function closeModal() { modalRoot.innerHTML = ''; currentModalId = null; }
function navModal(dir) {
  if (currentModalId == null) return;
  const idx = VARIANTS.findIndex(x => String(x.id) === String(currentModalId));
  if (idx === -1) return;
  openVariant(VARIANTS[(idx + dir + VARIANTS.length) % VARIANTS.length].id);
}
grid.addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (!open) return;
  openVariant(open.dataset.open);
});
modalRoot.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.stopPropagation(); openVariant(nav.dataset.nav); return; }
  if (e.target.closest('.modal-close')) { closeModal(); return; }
  if (e.target.classList && e.target.classList.contains('modal-overlay')) closeModal();
});
document.addEventListener('keydown', e => {
  if (currentModalId == null) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowLeft') navModal(-1);
  else if (e.key === 'ArrowRight') navModal(1);
});

document.getElementById('exportBtn').addEventListener('click', async () => {
  const s = loadState();
  const payload = {
    exportedAt: new Date().toISOString(),
    target: 'skeen merch',
    variants: VARIANTS.map(v => ({
      id: v.id, name: v.name, tagline: v.tagline,
      selected: !!(s[v.id] && s[v.id].selected),
      comment: (s[v.id] && s[v.id].comment) || null,
    })),
  };
  const json = JSON.stringify(payload, null, 2);
  try { await navigator.clipboard.writeText(json); showToast('copied — paste to claude'); }
  catch { prompt('Copy manually:', json); }
});
document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('Clear all comments and selections?')) return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
});
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
