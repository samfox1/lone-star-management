<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search and Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  /* Black and white. Colour means ONE thing: which number a line is. Five variables, in the
     categorical order the dataviz validator passed for a white page; each number keeps its own. */
  @property --cur { syntax: '<color>'; inherits: true; initial-value: #2a78d6; }
  :root {
    --paper: #ffffff; --ink: #111111; --ink-2: #6b7280; --ink-3: #9aa0a6; --line: #ececec; --mist: #f4f4f5; --mist-2: #e4e4e7;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 6px; }
  svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

  .mockbar { position: sticky; top: 0; z-index: 50; display: flex; gap: 28px; align-items: center; padding: 12px 40px; background: #fafafa; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
  .mockbar .grp { display: flex; gap: 6px; align-items: center; }
  .mockbar .grp > span { margin-right: 4px; }
  .mockbar button { padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-size: 12px; }
  .mockbar button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .is-analytics .search-only { display: none !important; }
  .is-search .analytics-only { display: none !important; }

  .page { max-width: 1180px; padding: 36px 40px 90px; }
  .top { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
  .engines { display: flex; gap: 14px; align-items: center; }
  .eng { position: relative; color: var(--ink-3); transition: color .2s; padding: 4px; }
  .eng svg { width: 18px; height: 18px; }
  .eng.on, .eng:hover { color: var(--ink); }
  .eng .pend { position: absolute; top: 1px; right: -2px; width: 6px; height: 6px; border-radius: 50%; background: #d99a2b; }
  .periods { position: relative; display: flex; gap: 18px; }
  .periods button { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-3); padding: 6px 0; transition: color .25s; }
  .periods button:hover { color: var(--ink); }
  .periods button.on { color: var(--ink); font-weight: 700; }
  .uline { position: absolute; bottom: -2px; height: 2px; border-radius: 2px; background: var(--ink); transition: left .45s var(--ease), width .45s var(--ease); }

  .verdict { display: flex; align-items: center; gap: 14px; margin-top: 30px; }
  .badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; flex: none; }
  .badge.wait { background: var(--mist); color: var(--ink-2); }
  .badge svg { width: 22px; height: 22px; stroke-width: 2.1; }
  .badge path.draw { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .badge.go path.draw { animation: draw .6s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .vt { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .vs { font-size: 14px; color: var(--ink-3); margin-top: 2px; }

  /* ── chart + the numbers beside it ── */
  .board { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 36px; margin-top: 30px; align-items: start; }
  .unit { font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 20px; }
  .chartwrap { position: relative; margin-top: 8px; }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .ax { font-family: 'Space Mono', monospace; font-size: 10.5px; fill: var(--ink-3); }
  .empty { position: absolute; inset: 40% 0 auto; text-align: center; font-size: 14px; color: var(--ink-3); opacity: 0; transition: opacity .3s; pointer-events: none; }
  .none-on .empty { opacity: 1; }
  .scrub { pointer-events: none; opacity: 0; transition: opacity .15s; }
  .scrubbing .scrub { opacity: 1; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 12px; padding: 8px 11px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -100%) translateY(-16px); opacity: 0; transition: opacity .15s; z-index: 4; }
  .tip b { font-family: 'Space Mono', monospace; font-size: 13px; }
  .tip .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .tip .row:first-child { margin-top: 0; }
  .tip .row i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tip .row span { color: #b8bcc4; }
  .tip .dt { color: #b8bcc4; font-family: 'Space Mono', monospace; font-size: 11px; }
  .scrubbing .tip.scrubtip { opacity: 1; }

  .rail { position: relative; padding-top: 4px; }
  .metric { position: relative; display: grid; grid-template-columns: 30px 1fr; gap: 14px; align-items: center; width: 100%; padding: 13px 0 13px 14px; text-align: left; transition: opacity .3s; }
  .metric::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--mc); transform: scaleY(0); transition: transform .35s var(--ease); }
  .metric.on::before { transform: scaleY(1); }
  .metric .mi { width: 28px; height: 28px; color: var(--ink-3); transition: color .3s; }
  .metric .mi svg { width: 28px; height: 28px; stroke-width: 1.5; }
  .metric.on .mi { color: var(--mc); }
  .metric:hover .mi svg { stroke-width: 2; }
  .metric .val { display: flex; align-items: baseline; gap: 9px; }
  .metric .n { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink-3); transition: color .3s; }
  .metric.on .n { color: var(--ink); }
  .metric .d { font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
  .metric.on .d { color: var(--ink); }
  .metric .lab { font-size: 13px; color: var(--ink-3); margin-top: 5px; transition: color .3s; }
  .metric.on .lab { color: var(--ink-2); }
  .metric + .metric { border-top: 1px solid var(--line); }
  .choose { display: inline-flex; align-items: center; gap: 8px; margin: 14px 0 0 14px; font-size: 13px; color: var(--ink-3); transition: color .2s; }
  .choose:hover { color: var(--ink); }
  .pop { position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 8px); padding: 8px; border-radius: 16px; background: #fff; box-shadow: 0 14px 40px rgba(17,17,17,.14), 0 0 0 1px rgba(17,17,17,.05); opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top left; transition: opacity .2s, transform .3s var(--ease); pointer-events: none; }
  .pop.show { opacity: 1; transform: none; pointer-events: auto; }
  .pop button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: 10px; font-size: 14px; text-align: left; transition: color .2s; color: var(--ink-2); }
  .pop button:hover { color: var(--ink); }
  .pop button .pi { width: 20px; height: 20px; color: var(--ink-3); }
  .pop button .pi svg { width: 20px; height: 20px; }
  .pop button .ck { margin-left: auto; width: 18px; height: 18px; color: var(--ink); opacity: 0; transition: opacity .2s; }
  .pop button.in { color: var(--ink); }
  .pop button.in .pi { color: var(--mc); }
  .pop button.in .ck { opacity: 1; }

  .pin { cursor: pointer; }
  .pin .bub { transition: transform .3s var(--ease); transform-box: fill-box; transform-origin: center; }
  .pin:hover .bub, .pin:focus .bub { transform: scale(1.12); }
  .card { position: absolute; z-index: 5; width: 280px; padding: 14px 16px; border-radius: 14px; background: #fff; box-shadow: 0 10px 30px rgba(17,17,17,.12), 0 0 0 1px rgba(17,17,17,.05); opacity: 0; transform: translate(-50%, calc(-100% - 22px)) scale(.96); transform-origin: bottom center; transition: opacity .22s, transform .32s var(--ease); pointer-events: none; }
  .card.show { opacity: 1; transform: translate(-50%, calc(-100% - 26px)) scale(1); }
  .card .h { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
  .card .ci { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; flex: none; }
  .card .ci.auto { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .card .ci svg { width: 14px; height: 14px; }
  .card .when { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-3); margin: 8px 0 0 38px; }
  .card .move { display: flex; align-items: center; gap: 8px; margin: 8px 0 0 38px; font-family: 'Space Mono', monospace; font-size: 13px; }
  .card .move i { width: 8px; height: 8px; border-radius: 50%; }
  .card .move .a { color: var(--ink-3); }
  .card .move .b { font-weight: 700; }

  /* ── Analytics views, kept and quieted ── */
  .sec { margin-top: 64px; }
  .sec-h { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }
  .sec-h svg { width: 18px; height: 18px; }
  .two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 64px; }
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px 12px; }
  .ring { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ring .rv { position: relative; width: 86px; height: 86px; }
  .ring svg.r { width: 86px; height: 86px; transform: rotate(-90deg); }
  .ring .rg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); }
  .ring .rg svg { width: 28px; height: 28px; }
  .ring.zero .rg { color: var(--ink-3); }
  .ring .rn { font-size: 13px; color: var(--ink-2); }
  .ring .rp { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; margin-top: -4px; }
  .ring.zero .rp { color: var(--ink-3); font-weight: 400; }
  .waffle { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 300px; }
  .waffle i { aspect-ratio: 1; border-radius: 4px; background: var(--mist); display: block; transition: background .45s; }
  .wleg { display: flex; gap: 22px; margin-top: 22px; }
  .wleg div { display: flex; align-items: center; gap: 10px; }
  .wleg svg { width: 24px; height: 24px; }
  .wleg .wp { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 18px; }
  .wleg .wn { font-size: 12px; color: var(--ink-2); }
  .wleg .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .mapwrap { position: relative; }
  .mapwrap canvas, .mapwrap svg { display: block; width: 100%; height: auto; }
  .mapwrap svg { position: absolute; inset: 0; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 1fr 54px; gap: 14px; align-items: center; height: 52px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row:last-child { border-bottom: 0; }
  .row .nm small { display: block; font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
  .row .meter { height: 4px; border-radius: 99px; background: var(--mist); overflow: hidden; }
  .row .meter i { display: block; height: 100%; border-radius: 99px; background: var(--ink); transform-origin: left; transform: scaleX(0); transition: transform 1s var(--ease); }
  .row .v { font-family: 'Space Mono', monospace; font-size: 13px; text-align: right; }
  .row.cover { grid-template-columns: 44px minmax(0, 1fr) 1fr 44px; height: 60px; }
  .row.cover img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: block; }
  .row.cover .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-3); }
  .srch { display: grid; grid-template-columns: minmax(0, 1fr) 84px 54px 60px; gap: 14px; align-items: center; height: 48px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .srch:last-child { border-bottom: 0; }
  .srch .spark { width: 84px; height: 22px; }
  .srch .rk { font-family: 'Space Mono', monospace; font-size: 13px; text-align: right; }
  .srch .mv { font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 700; text-align: right; }
  .srch .mv.flat { color: var(--ink-3); font-weight: 400; }
  .srch .mv.newb { justify-self: end; font-weight: 600; font-family: 'Instrument Sans'; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--mist); }

  @media (max-width: 960px) {
    .board, .two { grid-template-columns: 1fr; gap: 28px; }
    .rings { grid-template-columns: repeat(4, 1fr); }
    .page { padding: 28px 16px 60px; }
    .unit { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>

    const v = D[k][i], vis = on().includes(k) && defined(v)
    scrubDots[k].style.display = vis ? '' : 'none'
    if (!vis) continue
    const y = scaleFor(k).y(v); scrubDots[k].setAttribute('cx', x); scrubDots[k].setAttribute('cy', y); topY = Math.min(topY, y)
  }
  const date = fmt(d(D.start) + i * D.step * DAY) + (D.wipFrom !== undefined && i >= D.wipFrom ? ' · still counting' : '')
  $('scrubtip').innerHTML = `<div class="row"><span class="dt">${date}</span></div>` + on().map((k) => `<div class="row"><i style="background:${C(k).c}"></i><b>${defined(D[k][i]) ? C(k).show(D[k][i]) : '–'}</b><span>${C(k).lab}</span></div>`).join('')
  if (topY === H) topY = H - B
  $('scrubtip').style.left = x * s + 'px'; $('scrubtip').style.top = topY * s + 'px'
  wrap.classList.add('scrubbing')
})
wrap.addEventListener('pointerleave', () => wrap.classList.remove('scrubbing'))

/* ═══════════ the numbers on the right ═══════════ */
function countUp(el, text, delay) {
  const m = text.match(/^(\D*)([\d.,]+)(.*)$/)
  if (!m || reduce) { el.textContent = text; return }
  const [, pre, raw, post] = m, target = parseFloat(raw.replace(/,/g, '')), dec = (raw.split('.')[1] || '').length, commas = raw.includes(',')
  const from = pre === '#' ? target + 1.5 : 0, start = performance.now() + delay, dur = 1300
  const show = (v) => (commas ? Math.round(v).toLocaleString('en-US') : v.toFixed(dec))
  const step = (now) => { const t = Math.min(1, Math.max(0, (now - start) / dur)); el.textContent = pre + show(from + (target - from) * ease(t)) + post; if (t < 1) requestAnimationFrame(step) }
  requestAnimationFrame(step)
}
const tileVals = () => (S.page === 'search' ? (S.data === 'real' ? SEARCH.tiles.real : SEARCH.tiles.ex[S.period]) : ANALYTICS.tiles[S.period])
function drawRail(animate) {
  const vals = tileVals()
  $('rail').innerHTML = rail().map((k) => `
    <button class="metric ${on().includes(k) ? 'on' : ''}" data-k="${k}" aria-pressed="${on().includes(k)}" style="--mc:${C(k).c}">
      <span class="mi">${icon(C(k).icon)}</span>
      <span><span class="val"><span class="n" data-v="${vals[k][0]}"></span>${vals[k][1] ? `<span class="d">${vals[k][1]}</span>` : ''}</span><span class="lab">${C(k).lab}</span></span>
    </button>`).join('') +
    `<button class="choose" id="choose" aria-expanded="false">${icon('sliders')}Choose numbers</button>
     <div class="pop" id="pop">${ALL().map((k) => `<button data-c="${k}" class="${rail().includes(k) ? 'in' : ''}" style="--mc:${C(k).c}"><span class="pi">${icon(C(k).icon)}</span>${C(k).lab}<span class="ck">${icon('tick')}</span></button>`).join('')}</div>`
  $('rail').querySelectorAll('.metric').forEach((b, i) => {
    countUp(b.querySelector('.n'), b.querySelector('.n').dataset.v, animate ? 300 + i * 90 : 0)
    if (animate && !reduce) b.animate([{ opacity: 0, transform: 'translateX(10px)' }, { opacity: 1, transform: 'none' }], { duration: 450, delay: 150 + i * 70, easing: 'cubic-bezier(.22,.8,.24,1)', fill: 'backwards' })
    b.addEventListener('click', () => toggle(b.dataset.k))
  })
  $('choose').addEventListener('click', (e) => { e.stopPropagation(); const p = $('pop'), open = !p.classList.contains('show'); p.classList.toggle('show', open); $('choose').setAttribute('aria-expanded', open) })
  $('pop').querySelectorAll('button').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); pickMetric(b.dataset.c) }))
}
document.addEventListener('click', () => $('pop') && $('pop').classList.remove('show'))
function unitLine() {
  const o = on(), m = mode(), u = $('unit')
  u.textContent = m === 'none' ? 'Nothing on the chart.' : m === 'single' ? C(o[0]).unit
    : m === 'shared' ? `${listWords(o.map((k) => C(k).lab))[0].toUpperCase() + listWords(o.map((k) => C(k).lab)).slice(1)}, on one scale. Hover for the numbers.`
    : 'Different kinds of numbers, so each line runs from 0 to its own best. Hover for the numbers.'
  u.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: reduce ? 1 : 350, easing: 'cubic-bezier(.22,.8,.24,1)' })
}
function toggle(k) {
  wasOn = on()
  const set = S.onOf[S.page]
  if (set.includes(k)) set.splice(set.indexOf(k), 1); else set.push(k)
  $('rail').querySelectorAll('.metric').forEach((b) => { const is = on().includes(b.dataset.k); b.classList.toggle('on', is); b.setAttribute('aria-pressed', is) })
  unitLine(); morph()
}
function pickMetric(k) {
  const r = S.railOf[S.page]
  if (r.includes(k)) { if (r.length === 1) return; r.splice(r.indexOf(k), 1); const set = S.onOf[S.page]; if (set.includes(k)) { wasOn = on(); set.splice(set.indexOf(k), 1); morph() } }
  else { r.push(k); r.sort((a, b) => ALL().indexOf(a) - ALL().indexOf(b)) }
  drawRail(false); $('pop').classList.add('show'); unitLine()
}

/* ═══════════ top ═══════════ */
function verdict() { const v = P().verdict(S), b = $('badge'); b.classList.toggle('wait', !!v.wait); b.classList.remove('go'); $('badge-ic').innerHTML = `<use href="#i-${v.icon}"/>`; $('vt').textContent = v.t; $('vs').textContent = v.s; if (v.icon === 'check') { void b.offsetWidth; setTimeout(() => b.classList.add('go'), reduce ? 0 : 1900) } }
function periods() {
  $('periods').innerHTML = P().periods.map(([k, lab]) => `<button data-p="${k}" class="${S.period === k ? 'on' : ''}">${lab}</button>`).join('') + '<span class="uline" id="puline"></span>'
  $('periods').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => setPeriod(b.dataset.p)))
  requestAnimationFrame(movePul)
}
function movePul() { const o = $('periods').querySelector('button.on'), u = $('puline'); if (o && u) { u.style.left = o.offsetLeft + 'px'; u.style.width = o.offsetWidth + 'px' } }
function setPeriod(p) {
  if (p === S.period || (S.page === 'search' && S.data === 'real')) return
  wasOn = on(); S.period = p
  $('periods').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.p === p)); movePul()
  drawRail(false); verdict(); lower(); morph({ dates: true })
}

/* ═══════════ below the chart ═══════════ */
function lower() {
  const box = $('lower')
  if (S.page === 'search') {
    const k = S.data === 'real' ? 'real' : 'ex'
    const SR = { ex: [['skeen dj', [2.6, 2.4, 2.1, 1.8, 1.6, 1.4, 1.3], '#1.3', '↑ 1.3'], ['chicago house dj', [9.8, 8.6, 7.9, 7.2], '#7.2', 'new'], ['skeen rushing back remix', [2.4, 2.1, 1.9, 1.8], '#1.8', 'new'], ['dj skeen', [2.4, 2.2, 1.9, 1.7, 1.5], '#1.5', '↑ 0.9']], real: [['skeen dj', [2.6, 2.8], '#2.6', ''], ['dj skeen', [2.5, 2.3], '#2.4', ''], ['skeen music', [2.3, 1.5], '#2.0', '']] }[k]
    const AI = { ex: [['ChatGPT', 6], ['Perplexity', 2], ['Gemini', 0]], real: [['ChatGPT', 0], ['Perplexity', 0], ['Gemini', 0]] }[k], amax = Math.max(1, ...AI.map((a) => a[1]))
    box.innerHTML = `<div class="sec two">
      <div><div class="sec-h">${icon('search')}What people searched</div>${SR.map(([q, tr, rk, mv]) => { const mn = Math.min(...tr, 1), mx = Math.max(...tr) + .2, pts = tr.map((v, i) => `${(i / Math.max(1, tr.length - 1)) * 80 + 2},${((v - mn) / (mx - mn)) * 16 + 3}`).join(' '); return `<div class="srch"><span>${q}</span><svg class="spark" viewBox="0 0 84 22"><polyline points="${pts}" fill="none" style="stroke:var(--c1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="rk">${rk}</span><span class="mv ${mv === 'new' ? 'newb' : !mv ? 'flat' : ''}">${mv || '–'}</span></div>` }).join('')}</div>
      <div><div class="sec-h">${icon('ai')}Fans sent by AI</div>${AI.map(([n, v]) => `<div class="row"><span class="nm">${n}</span><span class="meter"><i data-w="${v / amax}"></i></span><span class="v">${v}</span></div>`).join('')}</div></div>`
    grow(); return
  }
  const wk = S.period === '7d'
  // Skeen's real numbers: Sep 7 to Oct 6, and the last 7 days (Sep 30 to Oct 6)
  const SRC = wk ? [['Instagram', 'instagram', 36], ['YouTube', 'youtube', 30], ['Direct', 'cursorfill', 20], ['Web search', 'google', 10], ['TikTok', 'tiktok', 3], ['Facebook', 'facebook', 0], ['SoundCloud', 'soundcloud', 0], ['Snapchat', 'snapchat', 0]]
    : [['Instagram', 'instagram', 47], ['Direct', 'cursorfill', 23], ['YouTube', 'youtube', 21], ['Web search', 'google', 6], ['TikTok', 'tiktok', 2], ['Facebook', 'facebook', .2], ['SoundCloud', 'soundcloud', .2], ['Snapchat', 'snapchat', .1]]
  const DEV = wk ? [['desktop', 'Computer', 54, '#111111'], ['mobile', 'Phone', 44, '#9aa0a6'], ['tablet', 'Tablet', 2, '#d9dade']] : [['mobile', 'Phone', 53, '#111111'], ['desktop', 'Computer', 45, '#9aa0a6'], ['tablet', 'Tablet', 2, '#d9dade']]
  const CT = wk ? [['United States', 168, 93], ['Germany', 16, 11], ['United Kingdom', 16, 10], ['Australia', 12, 4], ['Canada', 11, 6]] : [['United States', 989, 351], ['Germany', 126, 48], ['United Kingdom', 100, 45], ['Netherlands', 87, 33], ['Canada', 83, 26]]
  const SONGS = wk ? [['Rushing Back [Skeen Remix]', 4, 'https://oinywwblswidyupkpywa.supabase.co/storage/v1/object/public/media/c6c2ea6e-4135-4ebb-afbe-8c9e21785f57/covers/51bc45ed-1df0-4a83-82a0-d366cee8ae92.jpg'], ['Small Talk (Briston Maroney) [Skeen Remix]', 2, 'https://i1.sndcdn.com/artworks-zgNy2DVV1R935OOc-jI4ceg-t500x500.jpg'], ['Skeen LIVE @ Navy Pier Open Air', 1, 'https://i1.sndcdn.com/artworks-meoNkzNdXypr1Iw8-fSaqyQ-t500x500.jpg'], ['What I Want', 1, 'https://i.scdn.co/image/ab67616d0000b273d338d47f8f8964cc04f794e2']]
    : [['Rushing Back [Skeen Remix]', 86, 'https://oinywwblswidyupkpywa.supabase.co/storage/v1/object/public/media/c6c2ea6e-4135-4ebb-afbe-8c9e21785f57/covers/51bc45ed-1df0-4a83-82a0-d366cee8ae92.jpg'], ['Skeen LIVE @ Navy Pier Open Air', 23, 'https://i1.sndcdn.com/artworks-meoNkzNdXypr1Iw8-fSaqyQ-t500x500.jpg'], ['What I Want', 16, 'https://i.scdn.co/image/ab67616d0000b273d338d47f8f8964cc04f794e2'], ['Small Talk (Briston Maroney) [Skeen Remix]', 13, 'https://i1.sndcdn.com/artworks-zgNy2DVV1R935OOc-jI4ceg-t500x500.jpg'], ['You Were There', 4, 'https://i.scdn.co/image/ab67616d0000b27302e3919b9f17620c0e5a12ab']]
  const R0 = 36, CIRC = 2 * Math.PI * R0
  box.innerHTML = `
    <div class="sec two">
      <div><div class="sec-h">${icon('links')}Where they came from</div><div class="rings">${SRC.map(([n, g, p]) => `<div class="ring ${p < 1 ? 'zero' : ''}"><div class="rv"><svg class="r" viewBox="0 0 86 86"><circle cx="43" cy="43" r="${R0}" fill="none" stroke="#f1f1f3" stroke-width="5"/><circle class="arc" cx="43" cy="43" r="${R0}" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}" data-p="${p}"/></svg><span class="rg">${icon(g)}</span></div><span class="rn">${n}</span><span class="rp">${p < 1 ? (p ? '<1%' : '0%') : Math.round(p) + '%'}</span></div>`).join('')}</div></div>
      <div><div class="sec-h">${icon('mobile')}Phone or computer</div><div class="waffle" id="waffle">${Array.from({ length: 100 }, () => '<i></i>').join('')}</div>
        <div class="wleg">${DEV.map(([g, n, p, c]) => `<div><span class="sw" style="background:${c}"></span>${icon(g)}<span><div class="wp">${p}%</div><div class="wn">${n}</div></span></div>`).join('')}</div></div>
    </div>
    <div class="sec two">
      <div><div class="sec-h">${icon('globe')}Where they are</div><div class="mapwrap" id="mapwrap"></div></div>
      <div><div class="sec-h" style="visibility:hidden">${icon('globe')}.</div>${CT.map(([n, v, c]) => `<div class="row"><span class="nm">${n}<small>${c} cities</small></span><span class="meter"><i data-w="${v / CT[0][1]}"></i></span><span class="v">${num(v)}</span></div>`).join('')}<div class="more">+ ${wk ? 29 : 67} more countries</div></div>
    </div>
    <div class="sec"><div class="sec-h">${icon('music')}Most played</div><div class="two" style="gap:0 64px">${[SONGS.slice(0, 3), SONGS.slice(3)].map((col) => `<div>${col.map(([n, v, img]) => `<div class="row cover"><img src="${img}" alt=""><span class="nm">${n}</span><span class="meter"><i data-w="${v / SONGS[0][1]}"></i></span><span class="v">${v}</span></div>`).join('')}</div>`).join('')}</div></div>`
  grow()
  // rings draw round, one after another
  box.querySelectorAll('.arc').forEach((a, i) => { const p = +a.dataset.p; setTimeout(() => { a.style.transition = reduce ? 'none' : 'stroke-dashoffset 1.1s cubic-bezier(.22,.8,.24,1)'; a.style.strokeDashoffset = CIRC * (1 - Math.max(p, p ? 1.2 : 0) / 100) }, reduce ? 0 : 250 + i * 90) })
  // the waffle fills on a diagonal sweep, phone first
  const cells = [...$('waffle').children], order = cells.map((_, i) => i).sort((a, b) => ((a % 10) + Math.floor(a / 10)) - ((b % 10) + Math.floor(b / 10)) || a - b)
  let k = 0; const colours = DEV.flatMap(([, , p, c]) => Array(p).fill(c)); while (colours.length < 100) colours.push('#d9dade')
  order.forEach((ci, i) => setTimeout(() => (cells[ci].style.background = colours[k++]), reduce ? 0 : 200 + i * 9))
  drawMap(wk ? CITIES7 : CITIES30)
}
function grow() { requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.row .meter i').forEach((i, n) => { i.style.transitionDelay = (reduce ? 0 : 50 * n) + 'ms'; i.style.transform = `scaleX(${i.dataset.w})` }))) }

/* The world as quiet dots; every city a visit came from as an ink dot, sized by visits, landing
   biggest first. Land comes from world-atlas, drawn once into a canvas and sampled on a grid. */
let LAND = null
async function drawMap(cities) {
  const box = $('mapwrap'); if (!box || typeof d3 === 'undefined') return
  const Wm = 640, Hm = 330
  box.innerHTML = `<canvas width="${Wm * 2}" height="${Hm * 2}" style="aspect-ratio:${Wm}/${Hm}"></canvas><svg viewBox="0 0 ${Wm} ${Hm}"></svg>`
  if (!LAND) { const t = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')).json(); LAND = topojson.feature(t, t.objects.land) }
  const proj = d3.geoNaturalEarth1().fitExtent([[0, 0], [Wm, Hm]], { type: 'Sphere' }).rotate([-10, 0])
  const off = document.createElement('canvas'); off.width = Wm; off.height = Hm
  const oc = off.getContext('2d'); oc.fillStyle = '#000'; oc.beginPath(); d3.geoPath(proj, oc)(LAND); oc.fill()
  const px = oc.getImageData(0, 0, Wm, Hm).data
  const cv = box.querySelector('canvas').getContext('2d'); cv.scale(2, 2); cv.fillStyle = '#e4e4e7'
  for (let y = 3; y < Hm; y += 6) for (let x = 3; x < Wm; x += 6) { if (!(px[(y * Wm + x) * 4 + 3] > 0)) continue; const ll = proj.invert([x, y]); if (ll && ll[1] < -57) continue; cv.beginPath(); cv.arc(x, y, 1.35, 0, 7); cv.fill() }
  const s = box.querySelector('svg'), mx = Math.max(...cities.map((c) => c[2]))
  const sorted = [...cities].sort((a, b) => b[2] - a[2])
  sorted.forEach(([lat, lon, v], i) => {
    const p = proj([lon, lat]); if (!p) return
    const c = document.createElementNS(NS, 'circle'), r = 1.6 + Math.sqrt(v / mx) * 9
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', r); c.setAttribute('fill', '#111'); c.setAttribute('fill-opacity', v > 2 ? .78 : .5)
    if (!reduce) c.animate([{ r: 0, opacity: 0 }, { r, opacity: 1 }], { duration: 600, delay: 200 + Math.min(i, 120) * 10, easing: 'cubic-bezier(.3,1.4,.5,1)', fill: 'backwards' })
    s.appendChild(c)
  })
}

/* ═══════════ wiring ═══════════ */
function boot() {
  document.body.classList.toggle('is-analytics', S.page === 'analytics'); document.body.classList.toggle('is-search', S.page === 'search')
  wasOn = on(); periods(); verdict(); drawRail(true); unitLine(); lower(); intro()
}
const pick = (attr, val) => document.querySelectorAll(`[data-${attr}]`).forEach((x) => x.classList.toggle('on', x.dataset[attr] === val))
document.querySelectorAll('[data-page]').forEach((b) => b.addEventListener('click', () => { S.page = b.dataset.page; pick('page', S.page); S.period = S.page === 'analytics' ? '30d' : S.data === 'real' ? '28d' : '3m'; boot() }))
document.querySelectorAll('[data-data]').forEach((b) => b.addEventListener('click', () => { S.data = b.dataset.data; pick('data', S.data); S.period = S.data === 'real' ? '28d' : '3m'; boot() }))
const qs = new URLSearchParams(location.search)
if (qs.get('page') === 'analytics') { S.page = 'analytics'; pick('page', 'analytics'); S.period = '30d' }
if (qs.get('data') === 'real') { S.data = 'real'; pick('data', 'real'); if (S.page === 'search') S.period = '28d' }
if (qs.get('on')) S.onOf[S.page] = qs.get('on').split(',')
document.fonts.ready.then(boot)
</script>
