<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lone Star — B / One scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VARIANT B — ONE SCENE. The leoburnett route: a single full-bleed canvas carrying the
   whole page, type kept plain so the scene reads. The scene is not decoration: particles
   settle into the SURFACES a brand renders onto — site, poster, cover, EPK — and reform.
   Canvas 2D, ~90 lines of script, no library. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--mono:'Space Mono',ui-monospace,monospace;--sans:'Instrument Sans',system-ui,sans-serif;--acid:#d7ff3e}
html,body{height:100%}
body{background:#000;color:#fff;font-family:var(--sans);overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#000 22%,rgba(0,0,0,.45) 46%,rgba(0,0,0,0) 64%)}
.wrap{position:relative;z-index:2}
nav{display:flex;align-items:center;gap:12px;padding:30px 44px}
nav .mark{width:11px;height:11px;background:var(--acid);transform:rotate(45deg)}
nav .name{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-right:auto}
nav a{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;text-decoration:none;border:1px solid #333;border-radius:999px;padding:9px 17px;transition:.18s}
nav a:hover{border-color:var(--acid);color:var(--acid)}
.hero{min-height:660px;display:grid;grid-template-columns:minmax(320px,.9fr) 1.1fr;align-items:center;padding:40px 44px 0}
.hero .copy{max-width:19ch}
h1{font-size:clamp(44px,5.4vw,82px);line-height:.94;letter-spacing:-.04em;font-weight:700}
h1 .thin{font-weight:400;color:#9a9a9a}
.sub{margin-top:24px;font-size:16.5px;line-height:1.55;color:#b4b4b4;max-width:40ch}
.legend{margin-top:34px;display:flex;gap:9px;flex-wrap:wrap}
.legend button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:transparent;color:#7b7b7b;border:1px solid #2a2a2a;border-radius:999px;padding:8px 15px;cursor:pointer;transition:.2s}
.legend button.on{color:#000;background:var(--acid);border-color:var(--acid)}
.cta{margin-top:40px;display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#000;background:#fff;padding:16px 30px;text-decoration:none}
.strip{margin-top:120px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1c1c1c}
.strip div{padding:28px 30px;border-right:1px solid #1c1c1c}
.strip div:last-child{border-right:0}
.strip .n{font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:-.02em}
.strip .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6e6e6e;margin-top:8px}
.mock{position:fixed;right:18px;bottom:18px;z-index:9;background:#ff00a8;font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:6px 10px}
@media(max-width:1000px){.hero{grid-template-columns:1fr;text-align:left}}
@media(max-width:900px){.strip{grid-template-columns:repeat(2,1fr)}.strip div:nth-child(2){border-right:0}nav{padding:22px 20px;flex-wrap:wrap}.hero{padding:50px 20px 0}}
</style></head><body>
<canvas id="c"></canvas><div class="veil"></div>
<div class="wrap">
  <nav><i class="mark"></i><span class="name">Lone Star</span>
    <a href="#">Work</a><a href="#">What we do</a><a href="#">Get in touch</a></nav>
  <section class="hero"><div class="copy">
    <h1>One brand.<br><span class="thin">Every surface.</span></h1>
    <p class="sub">A site, a poster, a cover, a press kit — all rendered from the same system, kept current by the artist, not a developer.</p>
    <div class="legend" id="legend"></div>
    <a class="cta" href="#">See the work</a>
  </div></section>
  <div class="strip">
    <div><div class="n">12,480</div><div class="l">Views generated</div></div>
    <div><div class="n">4,102</div><div class="l">Clicks out</div></div>
    <div><div class="n">53</div><div class="l">Countries</div></div>
    <div><div class="n">31</div><div class="l">Booking enquiries</div></div>
  </div>
</div>
<div class="mock">MOCK NUMBERS</div>
<script>
/* The scene. Particles drift as dust, then settle into the outline of one surface at a
   time — site, poster, cover, EPK — hold, and scatter to the next. Same dust, new shape:
   the product's whole argument, as the only moving thing on the page. */
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio || 1, 2);
const N = 2600, P = [];
const SHAPES = ['site','poster','cover','epk'];
let shape = 0, t = 0;

function size(){ W = c.width = innerWidth * DPR; H = c.height = innerHeight * DPR; }
size(); addEventListener('resize', () => { size(); target(); });

for (let i = 0; i < N; i++) P.push({ x: Math.random()*W, y: Math.random()*H, tx: 0, ty: 0, v: .012 + Math.random()*.03, s: Math.random()*1.4 + .5 });

/** The outline of each surface, as points, centred on the canvas. */
function points(kind, cx, cy, u){
  const p = [], edge = (x0,y0,x1,y1,n) => { for (let i=0;i<n;i++){ const k=i/n; p.push([x0+(x1-x0)*k, y0+(y1-y0)*k]); } };
  const box = (w,h,n) => { edge(cx-w/2,cy-h/2,cx+w/2,cy-h/2,n); edge(cx+w/2,cy-h/2,cx+w/2,cy+h/2,n); edge(cx+w/2,cy+h/2,cx-w/2,cy+h/2,n); edge(cx-w/2,cy+h/2,cx-w/2,cy-h/2,n); };
  if (kind === 'site'){ box(u*2.2, u*1.45, 150); edge(cx-u*1.1, cy-u*1.45/2+u*.18, cx+u*1.1, cy-u*1.45/2+u*.18, 90); for(let r=0;r<3;r++) edge(cx-u*.85, cy-u*.2+r*u*.28, cx+u*.5, cy-u*.2+r*u*.28, 60); }
  if (kind === 'poster'){ box(u*1.25, u*1.8, 170); for(let r=0;r<4;r++) edge(cx-u*.45, cy-u*.5+r*u*.3, cx+u*.45, cy-u*.5+r*u*.3, 70); }
  if (kind === 'cover'){ box(u*1.5, u*1.5, 180); const R=u*.42; for(let i=0;i<180;i++){ const a=i/180*Math.PI*2; p.push([cx+Math.cos(a)*R, cy+Math.sin(a)*R]); } }
  if (kind === 'epk'){ box(u*1.35, u*1.75, 160); edge(cx-u*.5, cy-u*.55, cx+u*.5, cy-u*.55, 60); for(let r=0;r<6;r++) edge(cx-u*.5, cy-u*.25+r*u*.2, cx+u*.35, cy-u*.25+r*u*.2, 50); }
  return p;
}

function target(){
  const u = Math.min(W, H) * .30, cx = W * .70, cy = H * .46;
  const pts = points(SHAPES[shape], cx, cy, u);
  for (let i = 0; i < N; i++){ const q = pts[i % pts.length]; const j = (Math.random()-.5) * 6 * DPR; P[i].tx = q[0] + j; P[i].ty = q[1] + j; }
}
target();
setInterval(() => { shape = (shape + 1) % SHAPES.length; target(); paint(); }, 3400);

function paint(){
  const L = document.getElementById('legend');
  L.innerHTML = SHAPES.map((s,i) => `<button class="${i===shape?'on':''}">${s}</button>`).join('');
}
paint();

(function frame(){
  t += .01;
  x.fillStyle = 'rgba(0,0,0,.13)'; x.fillRect(0,0,W,H);
  for (const p of P){
    p.x += (p.tx - p.x) * p.v; p.y += (p.ty - p.y) * p.v;
    const drift = Math.sin(t + p.x * .0012) * .5 * DPR;
    x.fillStyle = 'rgba(215,255,62,' + (.3 + p.s * .45) + ')';
    x.fillRect(p.x + drift, p.y, p.s * 1.7 * DPR, p.s * 1.7 * DPR);
  }
  requestAnimationFrame(frame);
})();
</script></body></html>
